id: bangladesh-cyclone-1991
title:
  en: 1991 Bangladesh cyclone
  fr: Cyclone de 1991 au Bangladesh
description:
  en: >-
    One of the strongest cyclones recorded in the Bay of Bengal crossed the coast of south-eastern Bangladesh near Chittagong on the night of 29 to 30 April 1991, with winds of about 240 km/h. A storm surge of about 6 metres flooded the coast and offshore islands such as Kutubdia, where most homes were destroyed. An estimated 2 to 3 million people had been evacuated beforehand. The disaster prompted Operation Sea Angel, one of the largest military relief efforts ever carried out.
  fr: >-
    L’un des cyclones les plus puissants jamais enregistrés dans le golfe du Bengale a touché la côte sud-est du Bangladesh, près de Chittagong, dans la nuit du 29 au 30 avril 1991, avec des vents d’environ 240 km/h. Une onde de tempête d’environ 6 mètres a submergé la côte et les îles comme Kutubdia, où la plupart des habitations ont été détruites. Deux à trois millions de personnes avaient été évacuées au préalable. La catastrophe a donné lieu à l’opération Sea Angel, l’une des plus vastes opérations militaires de secours jamais menées.
