id: russian-plague-1770
title:
  en: 1770-1772 Russian plague
  fr: Peste de 1770-1772 en Russie
description:
  en: >-
    The last large plague epidemic in central Russia. It began in January 1770 among Russian troops in Moldavia during the Russo-Turkish War of 1768-1774 and spread north through Poland and Ukraine. It peaked in Moscow in September 1771, when about a thousand people died each day and much of the population fled. Anger at the anti-plague measures, including the removal of a venerated icon, sparked the Plague Riot, in which Archbishop Ambrosius was killed, and Catherine II sent Grigory Orlov to restore order.
  fr: >-
    Dernière grande épidémie de peste en Russie centrale. Apparue en janvier 1770 parmi les troupes russes en Moldavie, pendant la guerre russo-turque de 1768-1774, elle remonta vers le nord par la Pologne et l’Ukraine. Elle culmina à Moscou en septembre 1771, avec environ mille morts par jour, tandis qu’une grande partie des habitants fuyait. La colère contre les mesures sanitaires, dont le retrait d’une icône vénérée, provoqua l’émeute de la peste, où l’archevêque Ambroise fut tué ; Catherine II envoya Grigori Orlov rétablir l’ordre.
categories: [epidemic]
kind: event
