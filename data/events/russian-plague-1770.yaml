deaths:
  best: 53642
  low: 52000
  high: 100000
  note:
    en: Deaths in Moscow. Best is the 53,642 plague deaths recorded in the city from July to December 1771 (Dean et al., PNAS 2018), a minimum. Estimates of Moscow's total toll range from 52,000 to 100,000 out of some 300,000 inhabitants (Wikipedia, citing Melikishvili), which sets the range; historian L. E. Gorelova puts it above 100,000. Deaths among the troops in Moldavia and in Ukraine and other provinces are not included.
    fr: Morts à Moscou. L’estimation retenue correspond aux 53 642 décès de peste enregistrés dans la ville de juillet à décembre 1771 (Dean et al., PNAS 2018), un minimum. Les estimations du bilan total de Moscou vont de 52 000 à 100 000 sur quelque 300 000 habitants (Wikipédia, d’après Melikishvili), ce qui fixe la fourchette ; l’historienne L. E. Gorelova l’évalue à plus de 100 000. Les morts parmi les troupes en Moldavie, en Ukraine et dans les autres provinces ne sont pas inclus.
