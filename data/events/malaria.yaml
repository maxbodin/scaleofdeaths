  note:
    en: >-
      Carter and Mendis (2002) estimate that somewhere between 150 and 300 million people died from the effects of malaria during the 20th century, 2 to 5% of all deaths, a range also used by the US Institute of Medicine (2004). They give no central estimate, so best uses the low end of their range. No source gives per-country totals for the century; India is listed because the authors single it out for the highest death rates early in the century, and Nigeria, the Democratic Republic of the Congo and Niger because they account for the largest shares of malaria deaths today (WHO).
    fr: >-
      Carter et Mendis (2002) estiment qu’entre 150 et 300 millions de personnes sont mortes des effets du paludisme au cours du XXe siècle, soit 2 à 5 % de l’ensemble des décès, une fourchette reprise par l’Institute of Medicine américain (2004). Ils ne donnent pas d’estimation centrale : l’estimation retenue est donc la borne basse. Aucune source ne donne de total par pays pour le siècle ; l’Inde est listée car les auteurs y relèvent les plus forts taux de mortalité au début du siècle, et le Nigeria, la République démocratique du Congo et le Niger car ils concentrent aujourd’hui la plus grande part des décès (OMS).
