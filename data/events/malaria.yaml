id: malaria
title:
  en: Malaria in the 20th century
  fr: Paludisme au XXe siècle
description:
  en: >-
    Deaths from malaria, a parasitic disease spread by Anopheles mosquitoes, during the 20th century. In the first half of the century it killed at least 3 million people a year, with very high death rates in India and elsewhere in Asia, and it was still present in parts of Europe and the Americas. After the Second World War, campaigns spraying homes with DDT sharply cut deaths in Asia and eliminated the disease from countries such as the United States, while in tropical Africa it kept killing mainly young children.
  fr: >-
    Morts du paludisme, maladie parasitaire transmise par les moustiques anophèles, au cours du XXe siècle. Dans la première moitié du siècle, il tuait au moins 3 millions de personnes par an, avec des taux de mortalité très élevés en Inde et ailleurs en Asie, et sévissait encore dans certaines régions d’Europe et des Amériques. Après la Seconde Guerre mondiale, les campagnes d’aspersion des maisons au DDT ont fortement réduit les décès en Asie et éliminé la maladie de pays comme les États-Unis, tandis qu’en Afrique tropicale il continuait de tuer surtout de jeunes enfants.
