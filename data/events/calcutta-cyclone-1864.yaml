id: calcutta-cyclone-1864
title:
  en: 1864 Calcutta cyclone
  fr: Cyclone de Calcutta de 1864
description:
  en: >-
    A tropical cyclone from the Bay of Bengal crossed the coast of West Bengal, south of the Hooghly River, on 5 October 1864 and struck Calcutta (now Kolkata). A storm surge swept up the Hooghly and over the low-lying delta, washing away villages and destroying the ports of Khejuri and Hijli, while the winds flattened tens of thousands of huts and sank or damaged many ships. Most victims drowned; others died of the diseases, such as cholera, dysentery and smallpox, that were already rife.
  fr: >-
    Un cyclone tropical venu du golfe du Bengale a franchi la côte du Bengale-Occidental, au sud de l’Hooghly, le 5 octobre 1864, et frappé Calcutta (aujourd’hui Kolkata). Une onde de tempête a remonté l’Hooghly et submergé le delta, emportant des villages et détruisant les ports de Khejuri et de Hijli, tandis que les vents rasaient des dizaines de milliers de huttes et coulaient ou endommageaient de nombreux navires. La plupart des victimes se sont noyées ; d’autres ont succombé aux maladies qui sévissaient déjà, comme le choléra, la dysenterie et la variole.
categories: [natural-disaster]
