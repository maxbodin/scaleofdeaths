  note:
    en: >-
      Estimate of over 60,000 deaths (Wikipedia; India Today), mostly by drowning and the rest from diseases already prevalent before the storm. Contemporary reports give counts for only a few districts, so the total is an approximation.
    fr: >-
      Estimation de plus de 60 000 morts (Wikipédia ; India Today), surtout par noyade, les autres de maladies déjà présentes avant la tempête. Les rapports de l’époque ne donnent des chiffres que pour quelques districts : le total est une approximation.
