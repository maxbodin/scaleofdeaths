start: "1847"
end: "1859"
deaths:
  best: 1032864
  note:
    en: >-
      Registered deaths. Best is the official total for what the Brockhaus and Efron Encyclopedic Dictionary calls Russia's second cholera epidemic, which lasted 12 years (1847-1859) in European Russia proper: 2,589,833 cases and 1,032,864 deaths. The worst year, 1848, alone counted 1,742,439 cases and 690,150 deaths. Wikipedia, citing the historian Geoffrey Hosking, gives more than one million deaths for 1847-1851 only. Deaths outside European Russia (Caucasus, Siberia, Central Asia) are probably not included.
    fr: >-
      Décès enregistrés. L’estimation retenue est le total officiel de ce que le Dictionnaire encyclopédique Brockhaus et Efron appelle la deuxième épidémie de choléra en Russie, qui a duré 12 ans (1847-1859) en Russie d’Europe proprement dite : 2 589 833 cas et 1 032 864 morts. La pire année, 1848, compte à elle seule 1 742 439 cas et 690 150 morts. Wikipédia, d’après l’historien Geoffrey Hosking, donne plus d’un million de morts pour la seule période 1847-1851. Les morts hors de Russie d’Europe (Caucase, Sibérie, Asie centrale) ne sont sans doute pas comptés.
