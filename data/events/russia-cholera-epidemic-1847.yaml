id: russia-cholera-epidemic-1847
title:
  en: 1847-1859 Russian cholera epidemic
  fr: Épidémie de choléra de 1847-1859 en Russie
description:
  en: >-
    Cholera epidemic in the Russian Empire during the third cholera pandemic. After reaching Persia in 1846, the disease was carried to the shores of the Caspian Sea in 1847 and entered Russia by two routes, from the Black Sea and the Sea of Azov and from Turkey, the Danube and Odessa, and by the end of 1847 covered all of southern Russia. It reached Moscow in May 1848 and St Petersburg in June; 1848 was the worst cholera year in Russia's history. From Russia it spread to Germany and on to Britain and France. Outbreaks recurred in Russia, notably during the Crimean War, until 1859.
  fr: >-
    Épidémie de choléra dans l’Empire russe pendant la troisième pandémie de choléra. Arrivée en Perse en 1846, la maladie a atteint les rives de la Caspienne en 1847 et est entrée en Russie par deux voies, la mer Noire et la mer d’Azov d’une part, la Turquie, le Danube et Odessa d’autre part, et couvrait tout le sud du pays fin 1847. Elle a atteint Moscou en mai 1848 et Saint-Pétersbourg en juin ; 1848 fut la pire année de choléra de l’histoire russe. De Russie, elle a gagné l’Allemagne, la Grande-Bretagne et la France. Elle a resurgi, notamment pendant la guerre de Crimée, jusqu’en 1859.
categories: [epidemic]
