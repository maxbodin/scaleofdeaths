id: gaza-war
title:
  en: Gaza war
  fr: Guerre de Gaza
description:
  en: >-
    War that began on 7 October 2023 with the Hamas-led attack on Israel. Israel's air and ground offensive destroyed much of the Gaza Strip, displaced nearly all its population and led to famine conditions. A UN commission of inquiry (2025), Amnesty International (2024) and the International Association of Genocide Scholars (2025) concluded that Israel is committing genocide, and Human Rights Watch found acts of genocide; South Africa's case is pending at the International Court of Justice. Israel rejects these accusations. A ceasefire began on 10 October 2025, but deadly strikes continue.
  fr: >-
    Guerre commencée le 7 octobre 2023 par l’attaque menée par le Hamas contre Israël. L’offensive israélienne détruit une grande partie de la bande de Gaza, déplace presque toute sa population et provoque des conditions de famine. Une commission d’enquête de l’ONU (2025), Amnesty International (2024) et l’Association internationale des chercheurs sur le génocide (2025) concluent à un génocide commis par Israël, Human Rights Watch à des actes de génocide ; une requête sud-africaine est pendante devant la CIJ. Israël rejette ces accusations. Les frappes continuent malgré le cessez-le-feu de 2025.
