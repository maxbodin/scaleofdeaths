deaths:
  best: 77632
  high: 115000
  note:
    en: >-
      Best is the total compiled by Wikipedia on 9 October 2026: 75,586 Palestinians killed according to the Gaza Health Ministry (74,370 in the Gaza Strip and 1,216 in the West Bank, as relayed by the WHO) and 2,046 Israelis according to Israeli authorities (civilians and security personnel, including the 1,195 killed in the 7 October attacks and hostages who died in captivity). The ministry's Gaza toll reached 74,480 on 19 October 2026 (WAFA). Israel disputes the ministry's figures but has not published its own; the UN and independent experts consider the ministry the most reliable source (AP), and its count is a floor: it covers registered deaths only, and about 7,400 missing people presumed dead are not included (Wikipedia). Independent estimates are higher: a capture-recapture study in The Lancet estimated 64,260 deaths from traumatic injury in Gaza by 30 June 2024, when the ministry reported 37,877 (AFP); a household survey in The Lancet Global Health estimated 75,200 violent deaths by 5 January 2025, plus 8,540 excess non-violent deaths (Wikipedia). High is the estimate by researchers of the Max Planck Institute for Demographic Research and the Centre for Demographic Studies of about 115,000 violent deaths in Gaza in the first two years of war, to October 2025 (uncertainty interval 104,000 to 129,000). Not counted: indirect deaths from hunger, disease and the collapse of health care, which have not been fully estimated; about 1,200 attackers killed in Israel on 7 October, according to Israel; deaths in Lebanon, Syria, Yemen and Iran from the related regional conflicts. The figure for Israel counts only the 7 October attacks, the only source-stated toll for deaths inside Israel.
    fr: >-
      L’estimation centrale est le total compilé par Wikipédia au 9 octobre 2026 : 75 586 Palestiniens tués selon le ministère de la Santé de Gaza (74 370 dans la bande de Gaza et 1 216 en Cisjordanie, chiffres relayés par l’OMS) et 2 046 Israéliens selon les autorités israéliennes (civils et membres des forces de sécurité, dont les 1 195 morts des attaques du 7 octobre et les otages morts en captivité). Le bilan du ministère pour Gaza atteint 74 480 morts le 19 octobre 2026 (WAFA). Israël conteste les chiffres du ministère sans publier les siens ; l’ONU et des experts indépendants considèrent le ministère comme la source la plus fiable (AP), et son décompte est un plancher : il ne compte que les morts enregistrées, et les quelque 7 400 disparus présumés morts n’y figurent pas (Wikipédia). Les estimations indépendantes sont plus élevées : une étude par capture-recapture publiée dans The Lancet estimait à 64 260 les morts par traumatisme à Gaza au 30 juin 2024, quand le ministère en comptait 37 877 (AFP) ; une enquête auprès des ménages publiée dans The Lancet Global Health estimait à 75 200 les morts violentes au 5 janvier 2025, plus 8 540 morts non violentes en excès (Wikipédia). Le haut est l’estimation de chercheurs de l’Institut Max-Planck de recherche démographique et du Centre d’études démographiques de Barcelone : environ 115 000 morts violentes à Gaza pendant les deux premières années de guerre, jusqu’en octobre 2025 (intervalle d’incertitude de 104 000 à 129 000). Ne sont pas comptés : les morts indirectes dues à la faim, aux maladies et à l’effondrement du système de santé, qui n’ont pas été pleinement estimées ; les quelque 1 200 assaillants tués en Israël le 7 octobre, selon Israël ; les morts au Liban, en Syrie, au Yémen et en Iran dans les conflits régionaux liés. Le chiffre pour Israël ne compte que les attaques du 7 octobre, seul bilan chiffré par les sources pour les morts sur le sol israélien.
