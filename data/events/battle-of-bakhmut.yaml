deaths:
  best: 19547
  note:
    en: >-
      No source gives a total death toll for both sides; most published figures are casualties including wounded and are not used here. Best counts only the Wagner Group fighters killed in the battle, identified by name by BBC News Russian and Mediazona from documents on compensation paid to their families (June 2024), of whom 17,175 were recruited convicts (Kyiv Post); regular Russian troops are not included, and Meduza and Mediazona estimated about 21,000 dead among all Russian forces attacking Soledar and Bakhmut (Wikipedia). Ukrainian deaths are not included in best: the UALosses project had identified 14,235 Ukrainian soldiers killed in the battle by June 2026, with 16,569 missing (Wikipedia). The mayor reported 204 residents killed by the end of May 2023 (Wikipedia). The full toll is therefore much higher than best.
    fr: >-
      Aucune source ne donne de bilan des morts pour les deux camps ; la plupart des chiffres publiés sont des pertes incluant les blessés et ne sont pas utilisés ici. L’estimation centrale ne compte que les combattants du groupe Wagner tués dans la bataille, identifiés nominativement par BBC News en russe et Mediazona à partir de documents sur les indemnités versées à leurs familles (juin 2024), dont 17 175 détenus recrutés (Kyiv Post) ; les troupes russes régulières n’y figurent pas, et Meduza et Mediazona estimaient à environ 21 000 les morts de l’ensemble des forces russes ayant attaqué Soledar et Bakhmout (Wikipédia). Les morts ukrainiennes ne sont pas incluses : le projet UALosses avait identifié 14 235 soldats ukrainiens tués dans la bataille en juin 2026, et 16 569 disparus (Wikipédia). Le maire faisait état de 204 habitants tués fin mai 2023 (Wikipédia). Le bilan complet est donc bien plus élevé que l’estimation centrale.
