id: battle-of-bakhmut
title:
  en: Battle of Bakhmut
  fr: Bataille de Bakhmout
description:
  en: >-
    Battle for the city of Bakhmut in Ukraine's Donetsk region, one of the longest and deadliest of the war. Russian forces, led by the Wagner Group and its units of recruited convicts, shelled the city from May 2022 and attacked it from July in waves of infantry assaults against Ukrainian defences. Wagner's leader Yevgeny Prigozhin announced its capture on 20 May 2023. The city was left in ruins and nearly all of its 80,000 pre-war residents had fled.
  fr: >-
    Bataille pour la ville de Bakhmout, dans la région de Donetsk, l’une des plus longues et des plus meurtrières de la guerre. Les forces russes, menées par le groupe Wagner et ses unités de détenus recrutés en prison, bombardent la ville à partir de mai 2022 et l’attaquent à partir de juillet par vagues d’assauts d’infanterie contre les défenses ukrainiennes. Le chef de Wagner, Evgueni Prigojine, annonce sa prise le 20 mai 2023. La ville est en ruines et la quasi-totalité de ses 80 000 habitants d’avant-guerre l’ont fuie.
