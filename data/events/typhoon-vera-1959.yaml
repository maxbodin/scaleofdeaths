id: typhoon-vera-1959
title:
  en: Typhoon Vera
  fr: Typhon Vera
description:
  en: >-
    Typhoon Vera, known in Japan as the Isewan Typhoon, made landfall at the tip of the Kii Peninsula on Honshu on the evening of 26 September 1959, the strongest typhoon on record to strike Japan. It drove a storm surge of 3.55 metres, the highest ever observed there, into the head of Ise Bay, breaking sea walls and flooding the low-lying districts of Nagoya and the coasts of Aichi and Mie prefectures, where 83% of the victims died. The disaster led to Japan's 1961 Disaster Countermeasures Basic Act.
  fr: >-
    Le typhon Vera, appelé au Japon typhon d’Isewan, a touché terre à la pointe de la péninsule de Kii, sur Honshu, le soir du 26 septembre 1959 : le plus puissant typhon jamais arrivé sur le Japon. Il a poussé au fond de la baie d’Ise une onde de tempête de 3,55 mètres, la plus haute jamais observée à cet endroit, qui a rompu les digues et inondé les quartiers bas de Nagoya et les côtes des préfectures d’Aichi et de Mie, où sont mortes 83 % des victimes. La catastrophe a conduit à la loi fondamentale de 1961 sur la gestion des catastrophes.
