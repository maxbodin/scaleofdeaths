id: soma-mine-disaster
title:
  en: Soma mine disaster
  fr: Catastrophe minière de Soma
description:
  en: >-
    On 13 May 2014, near a shift change, a fire broke out in the Eynez coal mine at Soma, Manisa province, Turkey, where 787 workers were underground. The mine filled with smoke and carbon monoxide, which killed most of the victims. Rescue operations lasted four days and 486 workers survived. Reports after the disaster found that coal had been smouldering for days and listed serious safety failures, including missing carbon monoxide detectors and poor ventilation. It is the deadliest mining accident in Turkey's history.
  fr: >-
    Le 13 mai 2014, peu avant une relève, un incendie se déclare dans la mine de charbon d’Eynez, à Soma, dans la province de Manisa, en Turquie, alors que 787 ouvriers sont au fond. La mine s’emplit de fumée et de monoxyde de carbone, qui tue la plupart des victimes. Les secours durent quatre jours et 486 mineurs survivent. Les rapports établis ensuite montrent que le charbon se consumait depuis des jours et relèvent de graves manquements, dont l’absence de détecteurs de monoxyde de carbone et une mauvaise ventilation. C’est l’accident minier le plus meurtrier de l’histoire turque.
