  low: 100000
  note:
    en: "Excess deaths above normal mortality, from hunger and disease. Best: about 150,000 (Wikipedia), out of some 270,000 deaths in total over the three years. Low: 100,000, Ó Gráda's estimate of excess mortality in 1868."
    fr: "Surmortalité par rapport à la mortalité normale, due à la faim et aux maladies. Valeur centrale : environ 150 000 (Wikipédia), sur quelque 270 000 décès au total en trois ans. Bas : 100 000, estimation par Ó Gráda de la surmortalité de 1868."
