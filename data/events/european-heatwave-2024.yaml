id: european-heatwave-2024
title:
  en: 2024 European heat waves
  fr: Canicules de 2024 en Europe
description:
  en: >-
    The summer of 2024, in the hottest year on record worldwide, was the warmest yet measured in Europe. After a spring heat wave, repeated heat waves from June onwards broke regional temperature records in southern and south-eastern Europe. Italy had the largest number of heat-related deaths, while Greece, Bulgaria and Serbia had the highest death rates; 15 of the 32 countries studied had their highest heat-related mortality of 2022 to 2024. Women and people over 75 were the most affected.
  fr: >-
    L’été 2024, au cours de l’année la plus chaude jamais mesurée dans le monde, a été le plus chaud jamais enregistré en Europe. Après une canicule printanière, des vagues de chaleur répétées à partir de juin ont battu des records régionaux dans le sud et le sud-est du continent. L’Italie a compté le plus grand nombre de morts liées à la chaleur, la Grèce, la Bulgarie et la Serbie les taux les plus élevés ; 15 des 32 pays étudiés ont connu leur plus forte mortalité liée à la chaleur de la période 2022-2024. Les femmes et les plus de 75 ans ont été les plus touchés.
categories: [natural-disaster]
kind: event
start: "2024-06-01"
end: "2024-09-30"
deaths:
  best: 62775
  note:
    en: >-
      Estimated heat-related deaths between 1 June and 30 September 2024 in 32 European countries (Janoš et al., Nature Medicine, 2025), modelled from daily mortality data; per-country figures are the study's estimates published by ISGlobal. These are statistical estimates, not counted deaths.
    fr: >-
      Morts estimées liées à la chaleur entre le 1er juin et le 30 septembre 2024 dans 32 pays européens (Janoš et al., Nature Medicine, 2025), modélisées à partir de données quotidiennes de mortalité ; les chiffres par pays sont les estimations de l’étude publiées par ISGlobal. Ce sont des estimations statistiques, non des décès recensés.
