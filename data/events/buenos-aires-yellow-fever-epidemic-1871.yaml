id: buenos-aires-yellow-fever-epidemic-1871
title:
  en: 1871 Buenos Aires yellow fever epidemic
  fr: Épidémie de fièvre jaune de 1871 à Buenos Aires
description:
  en: >-
    Yellow fever epidemic in Buenos Aires, probably brought by soldiers returning from the Paraguayan War through Corrientes. The first three cases were diagnosed on 27 January 1871 in the crowded tenements of San Telmo. Deaths rose from about 20 a day before the epidemic to a peak of 583 on 10 April; a third of the inhabitants fled the city, and a citizens' People's Commission organised relief, losing several members, including its president José Roque Pérez. The disaster led to the opening of La Chacarita cemetery and to the building of running water and sewer systems.
  fr: >-
    Épidémie de fièvre jaune à Buenos Aires, sans doute apportée par des soldats revenant de la guerre du Paraguay via Corrientes. Les trois premiers cas ont été diagnostiqués le 27 janvier 1871 dans les conventillos surpeuplés de San Telmo. Les morts sont passés d’une vingtaine par jour avant l’épidémie à un pic de 583 le 10 avril ; un tiers des habitants a fui, et une Commission populaire a organisé les secours, perdant plusieurs membres, dont son président José Roque Pérez. La catastrophe a conduit à ouvrir le cimetière de la Chacarita et à construire réseaux d’eau courante et d’égouts.
categories: [epidemic]
