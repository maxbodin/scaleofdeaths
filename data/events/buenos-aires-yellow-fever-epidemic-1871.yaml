deaths:
  best: 14000
  low: 13500
  high: 14467
  note:
    en: >-
      Best is the reported toll of 14,000 lives in a city of about 180,000 given by the CDC's Emerging Infectious Diseases journal (2026). Wikipedia states that the toll was between 13,500 and 26,200: the official count from the diary of the witness Mardoqueo Navarro is about 13,600 (13,614 in the infobox, 13,641 in the text), and Dr Penna's count from cemetery registers is 14,467 (used as high). The English newspaper The Standard's figure of 26,000 was considered an exaggeration and is not used.
    fr: >-
      L’estimation retenue est le bilan de 14 000 vies, pour une ville d’environ 180 000 habitants, donné par la revue Emerging Infectious Diseases des CDC (2026). Selon Wikipédia, le bilan se situe entre 13 500 et 26 200 morts : le décompte officiel, tiré du journal du témoin Mardoqueo Navarro, est d’environ 13 600 (13 614 dans l’infobox, 13 641 dans le texte), et celui du Dr Penna d’après les registres des cimetières de 14 467 (haut de fourchette). Les 26 000 morts du journal anglais The Standard, jugés exagérés, ne sont pas retenus.
