kind: event
start: "1675-12-24"
end: "1676-07-15"
deaths:
  best: 11300
  low: 11000
  high: 11300
  note:
    en: Deaths on the island of Malta. Best is the "around 11,300" given by Wikipedia and by The Malta Independent (reviewing Joseph Micallef's history of the epidemic), which breaks it down into about 9,000 of 22,000 city dwellers (41%) and 2,000 of 29,000 country people. Encyclopaedia Britannica gives 11,000, used as the low bound.
    fr: Morts sur l’île de Malte. L’estimation retenue est celle d’« environ 11 300 » morts donnée par Wikipédia et par The Malta Independent (à propos de l’histoire de l’épidémie par Joseph Micallef), qui la répartit en environ 9 000 morts sur 22 000 citadins (41 %) et 2 000 sur 29 000 ruraux. L’Encyclopaedia Britannica donne 11 000, retenus comme borne basse.
