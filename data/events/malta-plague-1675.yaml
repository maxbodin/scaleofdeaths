id: malta-plague-1675
title:
  en: 1675-1676 Malta plague epidemic
  fr: Épidémie de peste de 1675-1676 à Malte
description:
  en: >-
    The deadliest epidemic in Maltese history, on the island of Malta, then ruled by the Order of St John. The first victim, the 11-year-old daughter of a Valletta textile merchant, fell ill on Christmas Eve 1675; the disease was blamed on English warships or on imported cloth. It spread from Valletta to the harbour cities and to most villages by May 1676, while Gozo and Mdina were spared. The cities were hit hardest: Valletta lost a third of its inhabitants and Senglea, Cospicua and Vittoriosa about half. The last victim died in July 1676.
  fr: >-
    L’épidémie la plus meurtrière de l’histoire maltaise, sur l’île de Malte, alors aux mains de l’ordre de Saint-Jean. La première victime, la fille de 11 ans d’un marchand de tissus de La Valette, tomba malade la veille de Noël 1675 ; on accusa des navires de guerre anglais ou des étoffes importées. Partie de La Valette, la maladie gagna les villes du port puis la plupart des villages en mai 1676, épargnant Gozo et Mdina. Les villes souffrirent le plus : La Valette perdit un tiers de ses habitants, Senglea, Cospicua et Vittoriosa la moitié environ. La dernière victime mourut en juillet 1676.
