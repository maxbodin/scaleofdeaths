id: great-plague-of-london
title:
  en: Great Plague of London
  fr: Grande peste de Londres
description:
  en: >-
    The last major epidemic of bubonic plague in England, part of the second plague pandemic. It began in the poor parish of St Giles in early 1665, spread through the crowded suburbs and peaked in September 1665, when over 7,000 plague deaths were recorded in a single week, before fading in 1666. The court and many wealthy residents fled, while houses of the sick were shut up for 40 days. Samuel Pepys described it in his diary.
  fr: >-
    Dernière grande épidémie de peste bubonique en Angleterre, dans le cadre de la deuxième pandémie de peste. Partie au début de 1665 de la paroisse pauvre de St Giles, elle gagna les faubourgs surpeuplés et culmina en septembre 1665, avec plus de 7 000 morts de la peste enregistrés en une semaine, avant de s’éteindre en 1666. La cour et de nombreux riches fuirent, tandis que les maisons des malades étaient condamnées pendant 40 jours. Samuel Pepys en a laissé le récit dans son journal.
categories: [epidemic]
kind: event
start: "1665"
