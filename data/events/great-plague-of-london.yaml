deaths:
  best: 100000
  low: 68596
  high: 100000
  note:
    en: Deaths in London. The Bills of Mortality recorded 68,596 plague deaths (68,595 according to Royal Museums Greenwich), an undercount; the true total is estimated at about 100,000, almost a quarter of the population according to Wikipedia, one fifth according to Royal Museums Greenwich. Deaths in other English towns, such as Eyam, are not included.
    fr: Morts à Londres. Les Bills of Mortality recensent 68 596 morts de la peste (68 595 selon les Royal Museums Greenwich), un chiffre sous-estimé ; le bilan réel est estimé à environ 100 000, près d’un quart de la population selon Wikipédia, un cinquième selon les Royal Museums Greenwich. Les morts dans d’autres villes anglaises, comme Eyam, ne sont pas incluses.
