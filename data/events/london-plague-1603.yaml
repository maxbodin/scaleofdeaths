  note:
    en: Plague deaths in London. Best is the "at least 30,000" given by historian Stephen Porter (Gresham College), in a city of perhaps 140,000 people in 1600. Wikipedia gives 23,045 (Moote) to 35,000 (Kohn), which sets the range, and says about a fifth of the population died.
    fr: Morts de la peste à Londres. L’estimation retenue est celle d’« au moins 30 000 » donnée par l’historien Stephen Porter (Gresham College), pour une ville d’environ 140 000 habitants en 1600. Wikipédia donne de 23 045 (Moote) à 35 000 (Kohn), ce qui fixe la fourchette, et estime qu’environ un cinquième de la population est mort.
