id: london-plague-1603
title:
  en: 1603 London plague
  fr: Peste de Londres de 1603
description:
  en: >-
    The first plague epidemic of the 17th century in London, at the transition from the Tudor to the Stuart period. Cases were first recorded in the outer parish of Stepney shortly after the funeral of Elizabeth I, and the disease spread through the crowded and poorly governed liberties around the city walls, home to two-thirds of Londoners. James I's coronation went ahead on 25 July 1603, but his royal entry into the city was postponed until April 1604, when the plague was said to have abated.
  fr: >-
    Première épidémie de peste du XVIIe siècle à Londres, au passage de l’époque Tudor à l’époque Stuart. Les premiers cas furent signalés dans la paroisse périphérique de Stepney peu après les funérailles d’Élisabeth Ire, et la maladie se répandit dans les « liberties » surpeuplées et mal administrées qui entouraient les remparts, où vivaient deux tiers des Londoniens. Le couronnement de Jacques Ier eut lieu le 25 juillet 1603, mais son entrée solennelle dans la ville fut reportée à avril 1604, la peste étant alors dite enrayée.
