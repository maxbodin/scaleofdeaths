deaths:
  best: 1434
  note:
    en: >-
      Total of national tolls compiled by Wikipedia and by Jeff Masters (Yale Climate Connections). It includes, for Malawi, 679 confirmed deaths and 537 people missing and presumed dead (Malawi's post-disaster needs assessment gives 679 dead and 537 missing). Counting only confirmed deaths would lower the total by 537. Per-country figures: Malawi 1,216, Mozambique 198, Madagascar 17, Zimbabwe 2 and Mauritius 1.
    fr: >-
      Total des bilans nationaux compilés par Wikipédia et par Jeff Masters (Yale Climate Connections). Il inclut, pour le Malawi, 679 morts confirmés et 537 disparus présumés morts (l’évaluation post-catastrophe du Malawi donne 679 morts et 537 disparus). Sans les disparus, le total serait inférieur de 537. Chiffres par pays : Malawi 1 216, Mozambique 198, Madagascar 17, Zimbabwe 2 et Maurice 1.
