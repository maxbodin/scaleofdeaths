id: cyclone-freddy-2023
title:
  en: Cyclone Freddy
  fr: Cyclone Freddy
description:
  en: >-
    Cyclone Freddy formed south of Indonesia on 4 February 2023 and crossed the whole southern Indian Ocean, becoming the longest-lasting tropical cyclone on record, at more than five weeks. It struck Madagascar on 21 February and Mozambique on 24 February, looped back over the Mozambique Channel and made a final landfall near Quelimane, Mozambique, on 11 March. It then brought days of torrential rain to southern Malawi, where flash floods and mudslides devastated Blantyre and its surroundings.
  fr: >-
    Le cyclone Freddy s’est formé au sud de l’Indonésie le 4 février 2023 et a traversé tout le sud de l’océan Indien, devenant le cyclone tropical le plus long jamais observé, avec plus de cinq semaines. Il a frappé Madagascar le 21 février et le Mozambique le 24 février, est reparti dans le canal du Mozambique et a touché terre une dernière fois près de Quelimane, au Mozambique, le 11 mars. Il a ensuite apporté des jours de pluies torrentielles au sud du Malawi, où crues et coulées de boue ont dévasté Blantyre et ses environs.
