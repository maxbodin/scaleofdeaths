id: bengal-famine-1770
title:
  en: Great Bengal famine of 1770
  fr: Grande famine du Bengale de 1770
description:
  en: >-
    Famine in Bengal and Bihar, then under the dual government of the East India Company, which held the right to collect revenue, and the Nawab of Bengal. Crop failures in 1768 and 1769 were followed by soaring rice prices, while the Company kept collecting land tax, bought rice for its army and provided little relief. Smallpox and other epidemics spread among the starving. North Bengal and Bihar were hit hardest, and many villages were deserted for years.
  fr: >-
    Famine au Bengale et au Bihar, alors sous le double gouvernement de la Compagnie des Indes orientales, qui percevait l’impôt, et du nawab du Bengale. Les mauvaises récoltes de 1768 et 1769 ont fait flamber le prix du riz, tandis que la Compagnie maintenait l’impôt foncier, achetait du riz pour son armée et apportait peu de secours. La variole et d’autres épidémies ont frappé une population affamée. Le nord du Bengale et le Bihar ont été les plus touchés et de nombreux villages sont restés désertés pendant des années.
