deaths:
  best: 10000000
  low: 1000000
  high: 10000000
  note:
    en: "Deaths from starvation and accompanying epidemics. Old and modern estimates differ greatly. Best and high: about 10 million, or a third of the population, the contemporary East India Company estimate of May 1770, still the most widely cited figure (Grove also writes of up to 10 million deaths in the 1768-1771 droughts). Low: at least 1 million; the historian Rajat Datta judged the contemporary figures inflated and proposed about 1.2 million deaths, and the demographer Tim Dyson calls 10 million barely credible, since there were no demographic data outside Calcutta and much of the apparent depopulation was migration."
    fr: "Morts de faim et des épidémies associées. Les estimations anciennes et modernes divergent fortement. Valeur centrale et haute : environ 10 millions, soit un tiers de la population, estimation de la Compagnie des Indes orientales en mai 1770, toujours la plus citée (Grove évoque lui aussi jusqu’à 10 millions de morts lors des sécheresses de 1768-1771). Bas : au moins 1 million ; l’historien Rajat Datta juge les chiffres de l’époque gonflés et propose environ 1,2 million de morts, et le démographe Tim Dyson trouve le chiffre de 10 millions à peine crédible, faute de données hors de Calcutta et parce qu’une grande part du dépeuplement apparent était due aux migrations."
