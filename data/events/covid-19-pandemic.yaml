id: covid-19-pandemic
title:
  en: COVID-19 pandemic
  fr: Pandémie de Covid-19
description:
  en: >-
    Pandemic of COVID-19, the disease caused by the SARS-CoV-2 coronavirus, which began with an outbreak in Wuhan, China, in December 2019 and spread worldwide in early 2020. The WHO treated it as a public health emergency of international concern from January 2020 to May 2023. Vaccines were deployed from December 2020. Official counts miss many deaths because testing and death registration were limited in many countries, so excess-mortality studies put the true toll at several times the reported figure.
  fr: >-
    Pandémie de Covid-19, la maladie due au coronavirus SARS-CoV-2, partie d’un foyer à Wuhan, en Chine, en décembre 2019, et répandue dans le monde entier au début de 2020. L’OMS l’a considérée comme une urgence de santé publique de portée internationale de janvier 2020 à mai 2023. Les vaccins ont été déployés à partir de décembre 2020. Les bilans officiels omettent de nombreux décès, faute de tests et d’état civil complets dans beaucoup de pays : les études de surmortalité estiment le bilan réel à plusieurs fois le chiffre déclaré.
categories: [epidemic]
kind: event
start: "2019-12"
ongoing: true
asOf: "2024-06-17"
deaths:
  best: 27314822
  low: 7051180
  high: 36290880
  note:
    en: >-
      Best is The Economist's central estimate of cumulative excess deaths (deaths from all causes above the expected level) worldwide, and high the upper end of its 95% interval (19.2 to 36.3 million), as of 17 June 2024, the last date of its model, published by Our World in Data. Low is the number of COVID-19 deaths reported to the WHO by countries as of 16 June 2024; reporting continued afterwards at a much slower pace. For comparison, the WHO estimated 14.9 million excess deaths (range 13.3 to 16.6 million) for 2020 and 2021 alone. Per-country figures are the deaths reported to the WHO as of 16 June 2024 (226 countries and territories, excluding 13 deaths on the Diamond Princess cruise ship); they understate the real toll, especially where testing was limited.
    fr: >-
      L’estimation centrale est celle de The Economist pour la surmortalité cumulée mondiale (décès toutes causes au-delà du niveau attendu), et la borne haute celle de son intervalle à 95 % (19,2 à 36,3 millions), au 17 juin 2024, dernière date de son modèle, publiée par Our World in Data. La borne basse est le nombre de décès dus au Covid-19 déclarés par les pays à l’OMS au 16 juin 2024 ; les déclarations ont continué ensuite à un rythme bien plus lent. À titre de comparaison, l’OMS a estimé la surmortalité à 14,9 millions de décès (de 13,3 à 16,6 millions) pour les seules années 2020 et 2021. Les chiffres par pays sont les décès déclarés à l’OMS au 16 juin 2024 (226 pays et territoires, hors 13 décès sur le paquebot Diamond Princess) ; ils sous-estiment le bilan réel, surtout là où les tests étaient limités.
