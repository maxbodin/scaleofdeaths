    fr: "Morts de faim et de maladie. Valeur centrale : environ 1 million, chiffre donné par l’Encyclopaedia Britannica. Bas : 300 000 et haut : 1,2 million, fourchette donnée par Wikipédia. La World Peace Foundation retient 800 000 et Ó Gráda 0,6 à 1 million."
