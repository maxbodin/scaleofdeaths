id: ethiopian-famine-1983
title:
  en: 1983-1985 famine in Ethiopia
  fr: Famine de 1983-1985 en Éthiopie
description:
  en: >-
    The worst famine in Ethiopia in a century, which affected about 7.75 million people in the north, especially Wollo, Tigray and Eritrea. Drought struck regions already ravaged by civil war, and the military government of Mengistu Haile Mariam, the Derg, restricted food supplies to areas held by insurgents such as the Tigray People's Liberation Front and carried out forced resettlement. Human Rights Watch attributed more than half of the deaths to human rights abuses. About 2.5 million people were displaced and 400,000 became refugees.
  fr: >-
    La pire famine en Éthiopie depuis un siècle a touché environ 7,75 millions de personnes dans le nord, surtout le Wollo, le Tigré et l’Érythrée. La sécheresse a frappé des régions déjà ravagées par la guerre civile, et le gouvernement militaire de Mengistu Haile Mariam, le Derg, a restreint l’approvisionnement des zones tenues par des insurgés comme le Front populaire de libération du Tigré et imposé des déplacements forcés. Human Rights Watch impute plus de la moitié des morts à des violations des droits humains. Environ 2,5 millions de personnes ont été déplacées et 400 000 ont fui le pays.
