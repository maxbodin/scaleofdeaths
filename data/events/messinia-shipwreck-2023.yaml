id: messinia-shipwreck-2023
title:
  en: 2023 Pylos migrant boat disaster
  fr: Naufrage de migrants de Pylos (2023)
description:
  en: >-
    In the early hours of 14 June 2023 the Adriana, an overloaded fishing trawler that had left Tobruk, Libya, for Italy with an estimated 400 to 750 migrants on board, capsized and sank in international waters of the Ionian Sea off Pylos, Messenia, within Greece's search and rescue zone. Most passengers came from Pakistan, Syria, Palestine and Egypt; only 104 men survived. Investigations by journalists questioned the Hellenic Coast Guard's account, suggesting that an attempt to tow the boat may have capsized it, which the coast guard denies; 17 coastguards were charged in 2025.
  fr: >-
    Aux premières heures du 14 juin 2023, l’Adriana, un chalutier surchargé parti de Tobrouk (Libye) pour l’Italie avec 400 à 750 migrants à bord selon les estimations, chavire et coule en mer Ionienne, dans les eaux internationales au large de Pylos (Messénie), en zone de sauvetage grecque. La plupart venaient du Pakistan, de Syrie, de Palestine et d’Égypte ; seuls 104 hommes survivent. Des enquêtes journalistiques ont mis en doute la version des garde-côtes grecs, suggérant qu’une tentative de remorquage a pu faire chavirer le bateau, ce qu’ils nient ; 17 garde-côtes ont été inculpés en 2025.
categories: [accident]
kind: event
start: "2023-06-14"
deaths:
  best: 650
  low: 82
  note:
    en: The number on board is uncertain (400 to 750), so the toll is an estimate. Best is the figure of some 650 dead given by UNHCR and IOM in 2025, out of some 750 on board. Only 82 bodies were recovered (low); Greek officials said over 500 people were presumed dead, and hundreds remain missing, including 209 Pakistanis according to Wikipedia. The boat sank in international waters in Greece's search and rescue zone, so the deaths are listed under Greece.
    fr: Le nombre de personnes à bord est incertain (400 à 750), si bien que le bilan est une estimation. L’estimation centrale est le chiffre d’environ 650 morts donné par le HCR et l’OIM en 2025, sur quelque 750 personnes à bord. Seuls 82 corps ont été retrouvés (bas de la fourchette) ; les autorités grecques ont déclaré plus de 500 personnes présumées mortes, et des centaines restent disparues, dont 209 Pakistanais selon Wikipédia. Le bateau a coulé dans les eaux internationales de la zone de sauvetage grecque, d’où le rattachement à la Grèce.
