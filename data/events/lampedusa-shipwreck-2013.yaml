id: lampedusa-shipwreck-2013
title:
  en: 2013 Lampedusa migrant shipwreck
  fr: Naufrage de migrants de Lampedusa (2013)
description:
  en: >-
    Early on 3 October 2013 a 20-metre fishing boat that had sailed from Misrata, Libya, with more than 500 migrants on board, mostly from Eritrea and Somalia, began to sink less than half a kilometre off Lampedusa, Italy, after engine trouble. To attract attention a blanket was set alight; the fire spread to fuel, people crowded to one side and the boat capsized. The Italian Coast Guard and boats nearby rescued 155 people. The disaster led Italy to launch Operation Mare Nostrum, and 3 October became a national day of remembrance.
  fr: >-
    Tôt le 3 octobre 2013, un bateau de pêche de 20 mètres parti de Misrata (Libye) avec plus de 500 migrants, surtout érythréens et somaliens, commence à couler à moins d’un demi-kilomètre de Lampedusa (Italie) après une panne de moteur. Pour se signaler, des passagers mettent le feu à une couverture ; les flammes gagnent le carburant, la foule se masse d’un côté et le bateau chavire. Les garde-côtes italiens et des bateaux voisins sauvent 155 personnes. Le drame conduit l’Italie à lancer l’opération Mare Nostrum, et le 3 octobre est devenu une journée nationale du souvenir.
categories: [accident]
kind: event
start: "2013-10-03"
deaths:
  best: 368
  low: 359
  note:
    en: Best is the figure of 368 dead commemorated by IOM, UNHCR and UNICEF and reported by ANSA. Low is the confirmed toll of 359 reached on 12 October 2013, when some bodies were still missing (Wikipedia). A separate shipwreck on 11 October 2013 in the Maltese search and rescue zone, with at least 34 dead, is not included.
    fr: L’estimation centrale est le chiffre de 368 morts commémoré par l’OIM, le HCR et l’UNICEF et rapporté par l’ANSA. Le bas de la fourchette est le bilan confirmé de 359 morts atteint le 12 octobre 2013, alors que des corps manquaient encore (Wikipédia). Un autre naufrage, le 11 octobre 2013 dans la zone de sauvetage maltaise, avec au moins 34 morts, n’est pas inclus.
