deaths:
  best: 2000000
  low: 700000
  high: 3000000
  note:
    en: Famine deaths in Henan, mostly from starvation and disease. Estimates differ widely and there is no consensus. Best is the low end of historian Lloyd Eastman's estimate that two to three million people starved to death, and high is its top. Low is the about 700,000 attributed by Wikipedia to Anthony Garnaut, whose quantitative study (Modern Asian Studies, 2013) concludes that excess deaths were "well under one million" and that the Nationalist government's 1943 survey toll of 1,484,983 also counts lost births and out-migration. Figures of 3 to 5 million, such as the 5 million in Stephen Devereux's famine table after Jasper Becker, are according to Garnaut generally unsourced or based on eyewitness estimates. Some deaths in the eastern Henan counties flooded since 1938 may also be counted in estimates for the Yellow River flood.
    fr: Morts de la famine au Henan, surtout de faim et de maladie. Les estimations varient beaucoup et ne font pas consensus. L’estimation centrale est le bas de l’estimation de l’historien Lloyd Eastman, selon qui deux à trois millions de personnes sont mortes de faim ; le haut de la fourchette en est le haut. Le bas de la fourchette est le chiffre d’environ 700 000 que Wikipédia attribue à Anthony Garnaut, dont l’étude quantitative (Modern Asian Studies, 2013) conclut à une surmortalité « bien inférieure à un million » et montre que le bilan de 1 484 983 de l’enquête du gouvernement nationaliste de 1943 inclut aussi la baisse des naissances et les départs. Les chiffres de 3 à 5 millions, comme les 5 millions du tableau des famines de Stephen Devereux d’après Jasper Becker, sont selon Garnaut généralement sans source ou fondés sur des témoignages. Certains morts des districts de l’est du Henan inondés depuis 1938 peuvent aussi être comptés dans les estimations de l’inondation du fleuve Jaune.
