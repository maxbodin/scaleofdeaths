id: henan-famine-1942
title:
  en: Henan famine of 1942-1943
  fr: Famine du Henan de 1942-1943
description:
  en: >-
    Famine in Henan province, China, during the Second Sino-Japanese War. The province was split by the front line and its farming was still disrupted by the deliberate Yellow River flood of 1938. In 1942 the rains failed and locusts damaged the harvest, while Nationalist and Japanese authorities kept requisitioning grain for their armies. Theodore White's report in Time magazine in March 1943 drew international attention to the famine, which also drove about three million people to flee the province.
  fr: >-
    Famine survenue dans la province du Henan, en Chine, pendant la guerre sino-japonaise. La province est coupée par la ligne de front et son agriculture reste désorganisée par l’inondation volontaire du fleuve Jaune de 1938. En 1942, les pluies font défaut et les criquets ravagent les récoltes, tandis que les autorités nationalistes et japonaises continuent de réquisitionner le grain pour leurs armées. Le reportage de Theodore White dans Time en mars 1943 alerte l’opinion internationale ; environ trois millions de personnes fuient la province.
categories: [famine]
