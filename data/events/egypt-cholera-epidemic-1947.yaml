id: egypt-cholera-epidemic-1947
title:
  en: 1947 Egyptian cholera epidemic
  fr: Épidémie de choléra de 1947 en Égypte
description:
  en: >-
    Cholera epidemic in Egypt that began in the town of al-Qurayn, in the Nile Delta, where the first death occurred on 21 September 1947. Despite quarantines, army cordons and isolation camps that many people tried to avoid, it spread through Lower Egypt to some 2,270 towns and villages within three months, helped by rural villagers drinking canal water also used for waste and bathing. The government, political movements and foreign aid, including mass vaccination, brought it under control: the last case was recorded on 31 December 1947, and the epidemic was declared over on 11 February 1948.
  fr: >-
    Épidémie de choléra en Égypte partie de la ville d’al-Qurayn, dans le delta du Nil, où le premier mort a été recensé le 21 septembre 1947. Malgré quarantaines, cordons militaires et camps d’isolement que beaucoup cherchaient à éviter, elle a gagné la Basse-Égypte et quelque 2 270 villes et villages en trois mois, favorisée par l’usage dans les villages de l’eau des canaux, servant aussi aux eaux usées et à la toilette. Le gouvernement, les mouvements politiques et l’aide étrangère, dont une vaccination de masse, l’ont enrayée : dernier cas le 31 décembre 1947, fin déclarée le 11 février 1948.
categories: [epidemic]
