deaths:
  best: 10277
  high: 20000
  note:
    en: >-
      Best is the official count of 10,277 deaths among 20,804 reported cases, from A. T. Shousha's report in the Bulletin of the World Health Organization (1948, corrected 1949), as cited by Wikipedia. The real toll is thought to be higher: Wikipedia cites estimates of up to 35,000 cases and 20,000 deaths, and a US Navy Medicine history article mentions one estimate of over 20,000 deaths (used as high).
    fr: >-
      L’estimation retenue est le bilan officiel de 10 277 morts sur 20 804 cas déclarés, tiré du rapport d’A. T. Shousha dans le Bulletin de l’Organisation mondiale de la santé (1948, corrigé en 1949), cité par Wikipédia. Le bilan réel serait plus lourd : Wikipédia cite des estimations allant jusqu’à 35 000 cas et 20 000 morts, et un article d’histoire de la médecine navale américaine évoque une estimation de plus de 20 000 morts (haut de fourchette).
