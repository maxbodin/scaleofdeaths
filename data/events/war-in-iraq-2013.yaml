id: war-in-iraq-2013
title:
  en: War in Iraq (2013-2017)
  fr: Guerre d’Irak contre l’État islamique (2013-2017)
description:
  en: >-
    War between the Iraqi government and its allies and the Islamic State group, which escalated from clashes in Anbar province at the end of 2013 and in June 2014 seized Mosul, Tikrit and large parts of northern and western Iraq. Iraqi security forces, Popular Mobilization Forces militias and Kurdish Peshmerga, backed by a US-led air campaign and by Iran, gradually retook the territory, ending with the battle of Mosul. The Islamic State carried out mass killings, including of Yazidis, and millions of people were displaced. Iraq declared victory on 9 December 2017.
  fr: >-
    Guerre entre l’Irak et ses alliés et le groupe État islamique, qui s’intensifie après des heurts dans l’Anbar fin 2013 et s’empare en juin 2014 de Mossoul, Tikrit et d’une grande partie du nord et de l’ouest de l’Irak. Forces irakiennes, milices des Unités de mobilisation populaire et peshmergas kurdes, appuyés par les frappes d’une coalition menée par les États-Unis et par l’Iran, reprennent peu à peu le terrain, jusqu’à la bataille de Mossoul. L’État islamique commet des massacres, notamment de Yézidis, et des millions de personnes fuient. L’Irak proclame la victoire le 9 décembre 2017.
categories: [war]
