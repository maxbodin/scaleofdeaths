id: china-floods-1931
title:
  en: 1931 China floods
  fr: Inondations de 1931 en Chine
description:
  en: >-
    After a long drought and a harsh winter, melting snow and exceptional rains, with nine cyclones in July 1931 alone, swelled the Yangtze, the Huai and other rivers of central China. From June to August they burst their dikes, flooding an area the size of England and half of Scotland, including the city of Wuhan, and affecting tens of millions of people. A dike breach at Lake Gaoyou on 25 August worsened the disaster. Most victims died not in the water but of the famine and epidemics that followed.
  fr: >-
    Après une longue sécheresse et un hiver rigoureux, la fonte des neiges et des pluies exceptionnelles, dont neuf cyclones en juillet 1931, ont fait gonfler le Yangzi, la Huai et d’autres cours d’eau du centre de la Chine. De juin à août, ils ont rompu leurs digues, inondant une surface équivalente à l’Angleterre et la moitié de l’Écosse, dont la ville de Wuhan, et touchant des dizaines de millions de personnes. La rupture d’une digue du lac Gaoyou, le 25 août, a aggravé la catastrophe. La plupart des victimes sont mortes non pas noyées, mais de la famine et des épidémies qui ont suivi.
