deaths:
  best: 2000000
  low: 422420
  high: 4000000
  note:
    en: >-
      Very contested. Best is the "as many as 2 million" deaths given by historian Chris Courtney (DisasterHistory.org), in line with the 1933 official relief report, which says that 2 million people died, drowned or for lack of food. Low is the 422,420 deaths counted by Chinese historians led by Li Wenhai from contemporary press reports (Wikipedia; its infobox gives 422,499); a field survey at the time found 150,000 drowned in the first months. High is the 3.7 to 4 million alleged by some Western sources (PBS NOVA: "almost four million"), figures that are widely disputed. Includes deaths from famine and from cholera, dysentery, typhoid and malaria.
    fr: >-
      Très contesté. L’estimation centrale est le chiffre de « jusqu’à 2 millions » de morts avancé par l’historien Chris Courtney (DisasterHistory.org), conforme au rapport officiel de secours de 1933, selon lequel 2 millions de personnes sont mortes, noyées ou faute de nourriture. L’estimation basse est le décompte de 422 420 morts établi par des historiens chinois dirigés par Li Wenhai à partir de la presse de l’époque (Wikipédia ; son infobox donne 422 499) ; une enquête de terrain menée alors comptait 150 000 noyés dans les premiers mois. L’estimation haute correspond aux 3,7 à 4 millions avancés par certaines sources occidentales (PBS NOVA : « près de quatre millions »), chiffres largement contestés. Comprend les morts dues à la famine et au choléra, à la dysenterie, à la typhoïde et au paludisme.
