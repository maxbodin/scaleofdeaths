id: bombing-of-tokyo-1945
title:
  en: Bombing of Tokyo (10 March 1945)
  fr: Bombardement de Tokyo (10 mars 1945)
description:
  en: >-
    Firebombing raid on Tokyo by 279 US B-29 bombers on the night of 9 to 10 March 1945, code-named Operation Meetinghouse. Flying low at night, the bombers dropped incendiaries on the densely built wooden districts of eastern Tokyo, causing a firestorm that burned out 15.8 square miles (about 41 km²) and destroyed 267,171 buildings, leaving over a million people homeless. Many victims burned, suffocated or drowned in rivers. It was the deadliest single air raid of the war, more destructive than either atomic bombing.
  fr: >-
    Raid incendiaire de 279 bombardiers B-29 américains sur Tokyo dans la nuit du 9 au 10 mars 1945, nom de code opération Meetinghouse. Volant bas, de nuit, les bombardiers larguent des bombes incendiaires sur les quartiers en bois très denses de l’est de Tokyo ; la tempête de feu ravage environ 41 km² et détruit 267 171 bâtiments, laissant plus d’un million de sans-abri. Beaucoup de victimes sont brûlées, asphyxiées ou noyées dans les rivières. C’est le raid aérien le plus meurtrier de la guerre, plus destructeur que chacun des bombardements atomiques.
categories: [war]
kind: event
