start: "1945-03-09"
end: "1945-03-10"
deaths:
  best: 100000
  low: 83600
  high: 105400
  note:
    en: People killed in the raid, mostly civilians. Best is the 100,000 used by the Japanese and US governments; according to Richard Frank, historians generally cite 90,000 to 100,000, and Associated Press reports for the 80th anniversary give more than 100,000. Low is the 83,600 dead estimated in 1945 by Tokyo's director of health (79,466 bodies were recovered and recorded; the US Strategic Bombing Survey gave 87,793 killed). High is the 105,400 victims honoured at the Tokyo Memorial Hall in 2011, a count of interred or claimed remains that leaves out bodies never recovered. Higher figures (200,000 by Edwin Hoyt, or several times 100,000 as suggested by Mark Selden) are not used.
    fr: Personnes tuées lors du raid, en majorité des civils. L’estimation centrale est le chiffre de 100 000 utilisé par les gouvernements japonais et américain ; selon Richard Frank, les historiens retiennent généralement 90 000 à 100 000 morts, et les dépêches de l’Associated Press pour le 80e anniversaire parlent de plus de 100 000. Le bas de la fourchette est l’estimation de 83 600 morts faite en 1945 par le directeur de la santé de Tokyo (79 466 corps ont été retrouvés et enregistrés ; l’US Strategic Bombing Survey comptait 87 793 tués). Le haut est le chiffre de 105 400 victimes honorées au mémorial de Tokyo en 2011, qui ne compte que les restes inhumés ou réclamés et omet les corps jamais retrouvés. Les chiffres plus élevés (200 000 selon Edwin Hoyt, ou plusieurs fois 100 000 selon Mark Selden) ne sont pas retenus.
