id: european-heatwave-2023
title:
  en: 2023 European heat waves
  fr: Canicules de 2023 en Europe
description:
  en: >-
    In 2023, the second warmest year on record in Europe, a series of summer heat waves struck the continent, the most severe being the "Cerberus" heat wave from 10 July, which brought record temperatures to southern Europe, above all Cyprus, Greece, Italy and Spain. Two hot spells, in mid-July and late August, accounted for more than half of the estimated heat-related deaths. Women and people over 80 were the most vulnerable; researchers estimate that the toll would have been about 80% higher without the adaptation to heat achieved since 2000.
  fr: >-
    En 2023, deuxième année la plus chaude jamais mesurée en Europe, une série de canicules estivales a frappé le continent, la plus sévère étant la vague de chaleur « Cerberus » à partir du 10 juillet, qui a apporté des températures record au sud de l’Europe, surtout à Chypre, en Grèce, en Italie et en Espagne. Deux épisodes, mi-juillet et fin août, représentent plus de la moitié des morts estimées. Les femmes et les plus de 80 ans ont été les plus vulnérables ; sans l’adaptation à la chaleur obtenue depuis 2000, le bilan aurait été environ 80 % plus lourd selon les chercheurs.
categories: [natural-disaster]
kind: event
start: "2023-06"
end: "2023-09"
deaths:
  best: 50798
  low: 47690
  high: 58000
  note:
    en: >-
      Estimated heat-related deaths, not counted deaths. Best is the 50,798 deaths for the summer (1 June to 30 September 2023) in 32 countries estimated with daily mortality data by Janoš et al. (Nature Medicine, 2025), which also give the per-country figures below (ISGlobal). Low is the earlier estimate of 47,690 deaths in 35 countries for the whole year by Gallo et al. (Nature Medicine, 2024), based on weekly data; its authors said that correcting the known underestimation of weekly data would give a toll of the order of 58,000 (high).
    fr: >-
      Morts estimées liées à la chaleur, et non décès recensés. L’estimation centrale correspond aux 50 798 morts de l’été (1er juin au 30 septembre 2023) dans 32 pays, estimées à partir de données quotidiennes par Janoš et al. (Nature Medicine, 2025), qui donnent aussi les chiffres par pays ci-dessous (ISGlobal). L’estimation basse est l’estimation antérieure de 47 690 morts dans 35 pays sur l’année, de Gallo et al. (Nature Medicine, 2024), fondée sur des données hebdomadaires ; ses auteurs estiment qu’en corrigeant la sous-estimation connue de ces données, le bilan serait de l’ordre de 58 000 (estimation haute).
