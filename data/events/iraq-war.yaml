id: iraq-war
title:
  en: Iraq War
  fr: Guerre d’Irak
description:
  en: >-
    War that began with the US-led invasion of Iraq in March 2003, which overthrew Saddam Hussein's government. It was followed by an insurgency against coalition forces and the new Iraqi authorities, and by sectarian violence that peaked in 2006-2007, with car bombs, suicide attacks, death squads, military operations and air strikes. The collapse of infrastructure and health services added indirect deaths. US forces withdrew in December 2011.
  fr: >-
    Guerre commencée en mars 2003 par l’invasion de l’Irak menée par les États-Unis, qui renverse le gouvernement de Saddam Hussein. Suivent une insurrection contre les forces de la coalition et les nouvelles autorités irakiennes et des violences confessionnelles culminant en 2006-2007 : voitures piégées, attentats-suicides, escadrons de la mort, opérations militaires et frappes aériennes. L’effondrement des infrastructures et des services de santé s’ajoute aux causes de décès. Les forces américaines se retirent en décembre 2011.
categories: [war]
