id: philippine-american-war
title:
  en: Philippine-American War
  fr: Guerre américano-philippine
description:
  en: >-
    War between the United States and Filipino nationalists of the First Philippine Republic, led by Emilio Aguinaldo, who sought independence after Spain ceded the Philippines to the United States in 1898. After a conventional phase in 1899, the Filipinos turned to guerrilla warfare. Both sides committed abuses; U.S. forces burned villages and forced civilians into reconcentration zones. Most deaths were civilians who died of violence, famine and epidemics of cholera and malaria.
  fr: >-
    Guerre entre les États-Unis et les nationalistes philippins de la Première République des Philippines, menés par Emilio Aguinaldo, qui réclamaient l’indépendance après la cession de l’archipel par l’Espagne en 1898. Après une phase conventionnelle en 1899, les Philippins passent à la guérilla. Les deux camps commettent des exactions ; les forces américaines brûlent des villages et regroupent de force les civils dans des zones de reconcentration. La plupart des morts sont des civils, victimes de violences, de famines et d’épidémies de choléra et de paludisme.
categories: [war]
kind: event
start: "1899-02-04"
end: "1902-07-04"
deaths:
  best: 220000
  low: 210000
  high: 280000
  note:
    en: Military and civilian deaths. Best is the Necrometrics estimate of 220,000; low and high are the 0.21 to 0.28 million range on Wikipedia's list of wars by death toll (citing Silbey and Immerwahr), which covers 1899 to 1913. The U.S. State Department gives over 4,200 American and over 20,000 Filipino combatants killed, and as many as 200,000 Filipino civilians dead from violence, famine and disease. Historian John Gates puts the maximum possible war-related toll for 1898 to 1903 at 321,000; claims of 600,000 to 1 million deaths are considered exaggerated.
    fr: Morts militaires et civiles. L’estimation centrale est celle de Necrometrics (220 000) ; le bas et le haut correspondent à la fourchette de 0,21 à 0,28 million de la liste des guerres de Wikipédia (citant Silbey et Immerwahr), qui couvre 1899-1913. Le département d’État américain indique plus de 4 200 combattants américains et plus de 20 000 combattants philippins tués, et jusqu’à 200 000 civils philippins morts de violences, de famine et de maladies. L’historien John Gates estime le maximum possible des morts liées à la guerre entre 1898 et 1903 à 321 000 ; les chiffres de 600 000 à un million de morts sont jugés exagérés.
