deaths:
  best: 22000
  low: 8034
  high: 25000
  note:
    en: >-
      Mostly civilians; the toll is unknown because Russian forces control the city and many bodies were buried in mass graves or removed with the rubble. Best is the estimate of about 22,000 deaths given by Mariupol's mayor in May 2022 (cited by Human Rights Watch). Low is the estimate by Human Rights Watch, SITU Research and Truth Hounds of at least 8,034 deaths above the peacetime rate between March 2022 and February 2023, based on at least 10,284 burials counted in satellite imagery, which they describe as a minimum. High is the Ukrainian government figure of at least 25,000 civilians killed (November 2022, Wikipedia). By June 2022 the UN had verified 1,348 civilian deaths and said the real number was likely thousands higher. Soldiers are not fully counted: Ukraine reported at least 906 of its soldiers killed and claimed 6,500 Russian soldiers killed, while Russia claimed over 4,000 Ukrainian soldiers killed (Wikipedia).
    fr: >-
      Surtout des civils ; le bilan est inconnu car la ville est contrôlée par les forces russes et de nombreux corps ont été enterrés dans des fosses communes ou évacués avec les décombres. L’estimation centrale est celle d’environ 22 000 morts donnée par le maire de Marioupol en mai 2022 (citée par Human Rights Watch). Le bas est l’estimation de Human Rights Watch, SITU Research et Truth Hounds d’au moins 8 034 morts au-delà du taux de mortalité du temps de paix entre mars 2022 et février 2023, fondée sur au moins 10 284 inhumations repérées sur images satellites, présentée comme un minimum. Le haut est le chiffre du gouvernement ukrainien d’au moins 25 000 civils tués (novembre 2022, Wikipédia). En juin 2022, l’ONU avait vérifié 1 348 morts civiles et estimait le nombre réel supérieur de plusieurs milliers. Les militaires ne sont pas entièrement comptés : l’Ukraine a fait état d’au moins 906 soldats ukrainiens et revendiqué 6 500 soldats russes tués, la Russie de plus de 4 000 soldats ukrainiens tués (Wikipédia).
