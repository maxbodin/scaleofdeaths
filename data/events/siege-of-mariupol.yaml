id: siege-of-mariupol
title:
  en: Siege of Mariupol
  fr: Siège de Marioupol
description:
  en: >-
    Siege and capture of the port city of Mariupol in south-eastern Ukraine by Russian and Donetsk People's Republic forces, from the first days of the full-scale invasion until the surrender of the last Ukrainian defenders at the Azovstal steelworks on 20 May 2022. Encircled residents went without electricity, water, heating and aid for weeks under constant shelling and air strikes, including the bombing of the drama theatre used as a shelter on 16 March. Most of the city's buildings were damaged or destroyed.
  fr: >-
    Siège et prise du port de Marioupol, dans le sud-est de l’Ukraine, par les forces russes et celles de la République populaire de Donetsk, des premiers jours de l’invasion à grande échelle jusqu’à la reddition des derniers défenseurs ukrainiens de l’usine Azovstal le 20 mai 2022. Encerclés, les habitants restent des semaines sans électricité, eau, chauffage ni aide sous des bombardements constants, dont celui du théâtre dramatique transformé en abri le 16 mars. La plupart des bâtiments de la ville sont endommagés ou détruits.
