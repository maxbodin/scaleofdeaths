asOf: "2018-12-31"
deaths:
  best: 450666
  low: 436747
  high: 852756
  note:
    en: Homicides linked to the armed conflict in 1985-2018 only, the period studied by Colombia's Truth Commission; deaths in 1964-1984 and since 2019 are not included, nor are the 121,768 victims of forced disappearance. Best is the 450,666 victims of homicide (credible interval 436,747 to 464,585, the low) estimated by the joint JEP-CEV-HRDAG project by statistically resolving documented records; about 80% were civilians. Including victims never documented in any database, the same project estimated 813,707 homicides (777,852 to 852,756, the high). The Commission attributed the killings mainly to paramilitary groups (45%), guerrillas (27%) and state agents (12%).
    fr: Homicides liés au conflit armé de 1985 à 2018 uniquement, période étudiée par la Commission de la vérité colombienne ; les morts de 1964 à 1984 et depuis 2019 ne sont pas comptées, pas plus que les 121 768 victimes de disparition forcée. L’estimation centrale correspond aux 450 666 victimes d’homicide (intervalle de crédibilité de 436 747, le bas, à 464 585) estimées par le projet conjoint JEP-CEV-HRDAG à partir des cas documentés ; environ 80 % étaient des civils. En incluant les victimes jamais documentées, le même projet estime 813 707 homicides (777 852 à 852 756, le haut). La Commission attribue les meurtres surtout aux paramilitaires (45 %), aux guérillas (27 %) et aux agents de l’État (12 %).
