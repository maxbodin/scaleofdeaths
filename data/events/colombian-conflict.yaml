id: colombian-conflict
title:
  en: Colombian armed conflict
  fr: Conflit armé colombien
description:
  en: >-
    Armed conflict in Colombia since the 1960s between the state, left-wing guerrillas such as the FARC and the ELN, and right-wing paramilitary groups, fuelled by land disputes and later by the drug trade. Most of the dead were civilians, killed in massacres, targeted killings and extrajudicial executions, including the "false positives" in which soldiers presented murdered civilians as guerrillas; millions were displaced. The 2016 peace agreement disarmed the FARC, but fighting continues with the ELN, FARC dissidents and armed groups linked to drug trafficking.
  fr: >-
    Conflit armé en Colombie depuis les années 1960 entre l’État, des guérillas de gauche comme les FARC et l’ELN, et des paramilitaires d’extrême droite, attisé par les conflits fonciers puis par la drogue. La plupart des morts sont des civils, victimes de massacres, d’assassinats ciblés et d’exécutions extrajudiciaires, dont les « faux positifs », civils tués par des soldats et présentés comme guérilleros ; des millions de personnes sont déplacées. L’accord de paix de 2016 désarme les FARC, mais les combats continuent avec l’ELN, des dissidents des FARC et des groupes liés au narcotrafic.
categories: [war]
