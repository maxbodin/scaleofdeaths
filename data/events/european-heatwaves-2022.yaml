id: european-heatwaves-2022
title:
  en: 2022 European heat waves
  fr: Canicules de 2022 en Europe
description:
  en: >-
    The summer of 2022 was the hottest season on record in Europe at the time. Successive heat waves from June to August, together with drought and wildfires, broke temperature records in many countries, and in mid-July temperatures above 40 °C were recorded in the United Kingdom for the first time. Heat-related mortality was highest around the Mediterranean, in Italy, Greece, Spain and Portugal, and markedly more women than men died.
  fr: >-
    L’été 2022 a été le plus chaud jamais enregistré en Europe à l’époque. Des vagues de chaleur successives de juin à août, accompagnées de sécheresse et d’incendies, ont battu des records de température dans de nombreux pays, et à la mi-juillet le Royaume-Uni a dépassé pour la première fois 40 °C. La mortalité liée à la chaleur a été la plus forte autour de la Méditerranée, en Italie, en Grèce, en Espagne et au Portugal, et nettement plus de femmes que d’hommes en sont mortes.
categories: [natural-disaster]
kind: event
start: "2022-05-30"
end: "2022-09-04"
deaths:
  best: 61672
  low: 37643
  high: 86807
  note:
    en: >-
      Heat-related deaths between 30 May and 4 September 2022 in 35 European countries, estimated by Ballester et al. (Nature Medicine, 2023) from weekly Eurostat mortality data; low and high are the 95% confidence interval, and per-country figures are the study's central estimates (Iceland: none). In November 2023 the same team found that weekly data underestimate heat deaths by about 10% and raised its estimate to about 70,000 (Euronews).
    fr: >-
      Morts liées à la chaleur entre le 30 mai et le 4 septembre 2022 dans 35 pays européens, estimées par Ballester et al. (Nature Medicine, 2023) à partir des données hebdomadaires de mortalité d’Eurostat ; les estimations basse et haute correspondent à l’intervalle de confiance à 95 %, et les chiffres par pays sont les estimations centrales de l’étude (Islande : aucun). En novembre 2023, la même équipe a montré que les données hebdomadaires sous-estiment d’environ 10 % les morts dues à la chaleur et a relevé son estimation à environ 70 000 (Euronews).
