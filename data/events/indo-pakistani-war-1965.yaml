id: indo-pakistani-war-1965
title:
  en: Indo-Pakistani War of 1965
  fr: Guerre indo-pakistanaise de 1965
description:
  en: >-
    War between India and Pakistan over Kashmir, which escalated in August 1965 after Pakistan sent infiltrators into Indian-administered Kashmir and India responded with attacks across the international border into Punjab. The seventeen days of full-scale fighting saw the largest tank battles since the Second World War. Both sides claimed far heavier enemy losses than they acknowledged for themselves. A UN-mandated ceasefire took effect on 23 September 1965, and the Tashkent Declaration of January 1966 restored the pre-war lines.
  fr: >-
    Guerre entre l’Inde et le Pakistan au sujet du Cachemire, qui s’intensifie en août 1965 après l’envoi par le Pakistan d’infiltrés au Cachemire sous administration indienne, l’Inde ripostant en attaquant au Pendjab, au-delà de la frontière. Les dix-sept jours de combats ouverts voient les plus grandes batailles de chars depuis la Seconde Guerre mondiale. Chaque camp revendique des pertes ennemies bien supérieures aux siennes. Un cessez-le-feu demandé par l’ONU entre en vigueur le 23 septembre 1965, et la déclaration de Tachkent de janvier 1966 rétablit les lignes d’avant-guerre.
categories: [war]
kind: event
start: "1965-08-05"
end: "1965-09-23"
deaths:
  best: 7000
  low: 5000
  high: 20000
  note:
    en: Mostly military deaths. Best is the "more than 7,000 Indian and Pakistani troops" killed estimated by Bercovitch and Jackson, consistent with the neutral figures on Wikipedia (about 3,000 Indian and 3,800 Pakistani dead), which are used per country. Low is Clodfelter's "over 5,000" fatalities, used as the best estimate in the PRIO Battle Deaths dataset; each government acknowledged far fewer of its own dead (1,333 Indian and 830 Pakistani). High is the 20,000 deaths, mostly civilian, given by Brogan and Eckhardt, figures not supported by other sources consulted.
    fr: Surtout des morts militaires. L’estimation centrale correspond aux « plus de 7 000 soldats indiens et pakistanais » tués selon Bercovitch et Jackson, cohérente avec les chiffres neutres de Wikipédia (environ 3 000 morts indiens et 3 800 morts pakistanais), repris par pays. Le bas correspond aux « plus de 5 000 » morts de Clodfelter, retenus comme meilleure estimation par le jeu de données PRIO sur les morts au combat ; chaque gouvernement ne reconnaissait que bien moins de pertes (1 333 morts indiens et 830 morts pakistanais). Le haut correspond aux 20 000 morts, surtout civils, avancés par Brogan et Eckhardt, chiffres que ne confirment pas les autres sources consultées.
