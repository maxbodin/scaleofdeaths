circa: true
deaths:
  best: 100000
  high: 250000
  note:
    en: "Ashoka's Major Rock Edict 13 states that 150,000 people were deported, 100,000 were killed and many times that number died afterwards. Best: the 100,000 killed of the edict (via Wikipedia, World History Encyclopedia and Necrometrics). High: 250,000 killed, the figure attributed to the historian Hemchandra Raychaudhuri (via Wikipedia), which may also count the deportees. These numbers come from the victor's own inscription and cannot be checked, and modern scholars question how literally Ashoka's account should be read."
    fr: "Le treizième édit sur rocher d’Ashoka indique que 150 000 personnes ont été déportées, 100 000 tuées et bien plus encore sont mortes ensuite. Estimation centrale : les 100 000 tués de l’édit (via Wikipédia, la World History Encyclopedia et Necrometrics). Haut : 250 000 tués, chiffre attribué à l’historien Hemchandra Raychaudhuri (via Wikipédia), qui compte peut-être aussi les déportés. Ces chiffres proviennent de l’inscription du vainqueur lui-même et ne peuvent être vérifiés, et des chercheurs modernes s’interrogent sur la manière littérale de lire le récit d’Ashoka."
