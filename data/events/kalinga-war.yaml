id: kalinga-war
title:
  en: Kalinga War
  fr: Guerre du Kalinga
description:
  en: >-
    War waged by the Mauryan emperor Ashoka to conquer the independent kingdom of Kalinga, on the east coast of India in what is now Odisha. According to Ashoka's own Major Rock Edict 13, the conquest caused immense suffering, with many people killed, deported or dying afterwards. His remorse is traditionally said to have turned him toward Buddhism and a policy of rule by dharma rather than conquest. The edict is the main source on the war.
  fr: >-
    Guerre menée par l’empereur maurya Ashoka pour conquérir le royaume indépendant du Kalinga, sur la côte est de l’Inde, dans l’actuel Odisha. Selon le treizième édit sur rocher d’Ashoka lui-même, la conquête a causé d’immenses souffrances, avec de nombreuses personnes tuées, déportées ou mortes par la suite. Ses remords l’auraient, selon la tradition, tourné vers le bouddhisme et vers un gouvernement fondé sur le dharma plutôt que sur la conquête. L’édit est la principale source sur cette guerre.
categories: [war]
kind: event
start: "-0262"
