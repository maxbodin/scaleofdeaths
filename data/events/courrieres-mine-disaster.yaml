id: courrieres-mine-disaster
title:
  en: Courrières mine disaster
  fr: Catastrophe de Courrières
description:
  en: >-
    Shortly after 6:30 on 10 March 1906 a coal-dust explosion swept through the galleries of a coal mine run by the Compagnie des mines de houille de Courrières near Lens, Pas-de-Calais, in northern France. About two-thirds of the miners underground were killed; most came from the nearby villages of Méricourt, Sallaumines, Billy-Montigny and Noyelles-sous-Lens. Thirteen survivors emerged after 20 days underground, and anger at the slow rescue sparked strikes across the coalfield. It remains Europe's deadliest mining disaster.
  fr: >-
    Peu après 6 h 30, le 10 mars 1906, un coup de poussière ravage les galeries d’une mine de la Compagnie des mines de houille de Courrières, près de Lens (Pas-de-Calais). Environ deux tiers des mineurs au fond sont tués ; la plupart venaient des villages voisins de Méricourt, Sallaumines, Billy-Montigny et Noyelles-sous-Lens. Treize rescapés remontent après 20 jours sous terre, et la colère contre la lenteur des secours déclenche des grèves dans tout le bassin minier. C’est toujours la catastrophe minière la plus meurtrière d’Europe.
