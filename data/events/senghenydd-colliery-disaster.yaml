id: senghenydd-colliery-disaster
title:
  en: Senghenydd colliery disaster
  fr: Catastrophe minière de Senghenydd
description:
  en: >-
    On the morning of 14 October 1913 an explosion tore through the Universal Colliery at Senghenydd, near Caerphilly in the South Wales Coalfield, where about 950 men were underground. The inquiry thought a spark from underground signalling equipment had most likely ignited firedamp, and coal dust spread the blast. Men in the western workings were killed by the explosion, fire and afterdamp, and fires delayed rescue for days. Safety measures required after an 81-death explosion at the same pit in 1901 had not been carried out. It is the worst mining accident in the United Kingdom.
  fr: >-
    Le matin du 14 octobre 1913, une explosion ravage l’Universal Colliery de Senghenydd, près de Caerphilly, dans le bassin houiller du sud du pays de Galles, où quelque 950 hommes travaillent au fond. Selon l’enquête, une étincelle d’un appareil de signalisation a probablement enflammé le grisou, et la poussière de charbon a propagé l’explosion. Les mineurs du secteur ouest sont tués par le souffle, le feu et les gaz, et les incendies retardent les secours pendant des jours. Les mesures exigées après une explosion qui avait fait 81 morts dans la même mine en 1901 n’avaient pas été prises.
