id: hurricane-katrina-2005
title:
  en: Hurricane Katrina
  fr: Ouragan Katrina
description:
  en: >-
    Hurricane Katrina crossed south Florida, strengthened to Category 5 over the Gulf of Mexico and made landfall in south-eastern Louisiana on 29 August 2005 as a Category 3 hurricane, before striking the Mississippi coast. Its storm surge devastated coastal Mississippi, and breaches in the levees and floodwalls of New Orleans left about 80% of the city flooded. Most of the loss of life was due to flooding caused by engineering flaws in the federally built flood protection system. Katrina is one of the costliest hurricanes on record.
  fr: >-
    L’ouragan Katrina a traversé le sud de la Floride, atteint la catégorie 5 dans le golfe du Mexique puis touché terre dans le sud-est de la Louisiane le 29 août 2005 en catégorie 3, avant de frapper la côte du Mississippi. Son onde de tempête a dévasté le littoral du Mississippi, et la rupture des digues et murs anti-crues de La Nouvelle-Orléans a inondé environ 80 % de la ville. La plupart des morts sont dues aux inondations causées par les défauts du système fédéral de protection. Katrina est l’un des ouragans les plus coûteux jamais enregistrés.
categories: [natural-disaster]
