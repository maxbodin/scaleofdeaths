deaths:
  best: 1392
  high: 1836
  note:
    en: >-
      Best is the 1,392 deaths (520 direct, 565 indirect and 307 of undetermined cause) in the National Hurricane Center report as updated in January 2023, after studies by Rappaport and Blanchard. High is the 1,836 deaths the NHC originally attributed to the storm (Wikipedia; often cited as 1,833).
    fr: >-
      L’estimation centrale est le bilan de 1 392 morts (520 directes, 565 indirectes et 307 de cause indéterminée) du rapport du National Hurricane Center mis à jour en janvier 2023 d’après les études de Rappaport et Blanchard. L’estimation haute correspond aux 1 836 morts initialement attribuées à l’ouragan par le NHC (Wikipédia ; souvent cité comme 1 833).
