asOf: "2026-06-30"
deaths:
  best: 49000
  note:
    en: >-
      Reported deaths linked to militant Islamist groups, compiled from ACLED data by the Africa Center for Strategic Studies: over 49,000 in the Sahel over the decade to mid-2025, and nearly 49,000 from 2022 to mid-2026 alone (best). Neither count covers the whole conflict since 2012, so the full toll is higher; the Africa Center also warns of undercounting because the military governments restrict reporting. Deaths in violence that does not involve militant Islamist groups (for example some army and militia massacres or intercommunal clashes) may not be included. Mali alone has had an estimated 17,700 such deaths since the late 2000s (to mid-2025). Wikipedia sums annual figures to over 68,900 killed since 2007, a total not published by any single source.
    fr: >-
      Morts signalées liées aux groupes islamistes armés, compilées à partir des données d’ACLED par l’Africa Center for Strategic Studies : plus de 49 000 au Sahel au cours de la décennie précédant la mi-2025, et près de 49 000 entre 2022 et la mi-2026 seulement (estimation centrale). Aucun de ces décomptes ne couvre tout le conflit depuis 2012, le bilan complet est donc plus élevé ; l’Africa Center signale aussi une sous-estimation due aux restrictions imposées à l’information par les juntes. Les morts de violences sans lien avec des groupes islamistes (certains massacres de l’armée et des milices, affrontements intercommunautaires) peuvent ne pas être comptées. Le Mali seul compte environ 17 700 morts de ce type depuis la fin des années 2000 (jusqu’à la mi-2025). Wikipédia additionne des chiffres annuels pour atteindre plus de 68 900 morts depuis 2007, un total qu’aucune source unique ne publie.
