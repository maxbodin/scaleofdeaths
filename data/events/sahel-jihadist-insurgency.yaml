id: sahel-jihadist-insurgency
title:
  en: War in the Sahel
  fr: Guerre au Sahel
description:
  en: >-
    Jihadist insurgency in the central Sahel, mainly in Mali, Burkina Faso and Niger, which grew out of the 2012 Tuareg rebellion and the jihadist takeover of northern Mali. Groups linked to al-Qaeda, united since 2017 in JNIM, and the Islamic State in the Greater Sahara spread from Mali to Burkina Faso and Niger, attacking soldiers and civilians, while army and militia operations also killed many civilians. After French and UN forces left, the military juntas turned to Russian forces as violence kept rising.
  fr: >-
    Insurrection djihadiste au Sahel central, surtout au Mali, au Burkina Faso et au Niger, née de la rébellion touarègue de 2012 et de la prise du nord du Mali par des djihadistes. Des groupes liés à al-Qaïda, réunis depuis 2017 dans le JNIM, et l’État islamique au Grand Sahara s’étendent du Mali au Burkina Faso et au Niger et attaquent soldats et civils, tandis que les opérations de l’armée et des milices tuent aussi de nombreux civils. Après le départ des forces françaises et onusiennes, les juntes militaires se tournent vers des forces russes, et la violence continue de croître.
categories: [war]
kind: event
