deaths:
  best: 16607
  note:
    en: >-
      CRED, 2025 Disasters in Numbers (EM-DAT): 16,607 deaths in 2025, against a 2005-2024 average of 57,429 a year. CRED warns that the 2025 figures may be revised and that, because of reporting delays, many heatwave deaths (in Pakistan, India and Europe) and drought deaths are not yet included; drought mortality is usually not reported at all. Per-country figures are the report's ten deadliest events: Myanmar earthquake 3,820, Afghanistan earthquake 2,200, Indonesia (Cyclone Senyar) 1,109, Pakistan floods 1,037, Sri Lanka (Cyclone Ditwah) 823, Sudan landslide 400, Philippines (Typhoon Kalmaegi) 372, Thailand 276; Nigeria uses its larger event (Mokwa flood, 1,100) as a lower bound, as it also had 238 deaths in June-October floods.
    fr: >-
      CRED, 2025 Disasters in Numbers (EM-DAT) : 16 607 morts en 2025, contre une moyenne de 57 429 par an sur 2005-2024. Le CRED prévient que les chiffres 2025 peuvent être révisés et que, en raison de retards de déclaration, de nombreux décès dus aux canicules (Pakistan, Inde, Europe) et aux sécheresses ne sont pas encore inclus ; la mortalité due aux sécheresses n’est en général pas déclarée. Les chiffres par pays sont les dix événements les plus meurtriers du rapport : séisme en Birmanie 3 820, séisme en Afghanistan 2 200, Indonésie (cyclone Senyar) 1 109, inondations au Pakistan 1 037, Sri Lanka (cyclone Ditwah) 823, glissement de terrain au Soudan 400, Philippines (typhon Kalmaegi) 372, Thaïlande 276 ; pour le Nigeria, l’événement le plus lourd (inondation de Mokwa, 1 100) sert de borne basse, 238 autres morts étant dues aux inondations de juin à octobre.
