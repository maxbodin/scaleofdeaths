id: natural-disaster-deaths-annual
title:
  en: Deaths from natural disasters per year
  fr: Décès dus aux catastrophes naturelles par an
description:
  en: >-
    People killed by natural hazard-related disasters worldwide in one year, as recorded by the Emergency Events Database (EM-DAT) of the Centre for Research on the Epidemiology of Disasters (CRED). It covers earthquakes, storms, floods, landslides, wildfires, droughts and extreme temperatures, and counts the missing presumed dead. In 2025, 358 disasters were recorded; the deadliest were the earthquakes in Myanmar in March and in eastern Afghanistan, and Asia accounted for almost three quarters of deaths. There was no mega-disaster, and the toll was well below the 2005-2024 yearly average.
  fr: >-
    Personnes tuées par des catastrophes d’origine naturelle dans le monde en un an, selon la base de données EM-DAT du Centre de recherche sur l’épidémiologie des désastres (CRED). Sont comptés séismes, tempêtes, inondations, glissements de terrain, incendies, sécheresses et températures extrêmes, disparus présumés morts compris. En 2025, 358 catastrophes ont été recensées ; les plus meurtrières ont été les séismes de mars en Birmanie et de l’est de l’Afghanistan, et l’Asie concentre près des trois quarts des morts. Le bilan est très inférieur à la moyenne annuelle 2005-2024.
categories: [annual, natural-disaster]
