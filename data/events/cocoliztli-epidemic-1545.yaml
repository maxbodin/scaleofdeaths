deaths:
  best: 5000000
  low: 5000000
  high: 15000000
  note:
    en: >-
      Sources only give a range: the CDC's Emerging Infectious Diseases journal (Acuna-Soto et al., 2002) and later studies estimate that the epidemic killed 5 to 15 million people, up to 80% of the native population of Mexico. No source states a central estimate, so best uses the low end of that range. Mexico's per-country figure is the same low end; the epidemic also reached Chiapas and Guatemala.
    fr: >-
      Les sources ne donnent qu’une fourchette : la revue Emerging Infectious Diseases des CDC (Acuna-Soto et al., 2002) et des études ultérieures estiment que l’épidémie a tué de 5 à 15 millions de personnes, jusqu’à 80 % de la population autochtone du Mexique. Aucune source ne donne d’estimation centrale : l’estimation retenue est donc le bas de la fourchette. Le chiffre du Mexique reprend ce bas de fourchette ; l’épidémie a aussi atteint le Chiapas et le Guatemala.
