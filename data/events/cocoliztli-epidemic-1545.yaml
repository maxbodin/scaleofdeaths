id: cocoliztli-epidemic-1545
title:
  en: Cocoliztli epidemic of 1545-1548
  fr: Épidémie de cocoliztli de 1545-1548
description:
  en: >-
    Epidemic of a disease the Aztecs called cocoliztli ("pestilence" in Nahuatl) that swept the highlands of New Spain, in present-day Mexico and Guatemala, a generation after the Spanish conquest. Victims suffered high fever and bleeding and often died within a week; Indigenous people were by far the most affected. Its cause is still debated: ancient DNA from an epidemic cemetery in Oaxaca points to Salmonella Paratyphi C (enteric fever), while other researchers favour a native haemorrhagic fever worsened by a severe drought.
  fr: >-
    Épidémie d’une maladie que les Aztèques appelaient cocoliztli (« pestilence » en nahuatl), qui a ravagé les hautes terres de la Nouvelle-Espagne, dans l’actuel Mexique et au Guatemala, une génération après la conquête espagnole. Les malades souffraient de forte fièvre et d’hémorragies, et mouraient souvent en moins d’une semaine ; les Autochtones ont été de loin les plus touchés. Sa cause reste débattue : l’ADN ancien d’un cimetière d’Oaxaca désigne Salmonella Paratyphi C, d’autres chercheurs penchent pour une fièvre hémorragique locale aggravée par une grave sécheresse.
categories: [epidemic]
kind: event
start: "1545"
