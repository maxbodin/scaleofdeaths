id: beirut-port-explosion
title:
  en: 2020 Beirut port explosion
  fr: Explosion du port de Beyrouth
description:
  en: >-
    On 4 August 2020 about 2,750 tonnes of ammonium nitrate, confiscated from the cargo ship Rhosus and stored at the port of Beirut, Lebanon, without adequate safety measures since 2014, detonated after a fire broke out nearby. One of the most powerful non-nuclear explosions ever recorded, it destroyed the port, damaged more than half of the city and was felt as far as Cyprus. About 7,000 people were injured and some 300,000 displaced. Human Rights Watch found evidence that several Lebanese authorities had been at least criminally negligent.
  fr: >-
    Le 4 août 2020, environ 2 750 tonnes de nitrate d’ammonium, saisies sur le cargo Rhosus et stockées sans mesures de sécurité adéquates dans le port de Beyrouth, au Liban, depuis 2014, explosent après un incendie voisin. L’une des plus puissantes explosions non nucléaires jamais enregistrées détruit le port, endommage plus de la moitié de la ville et est ressentie jusqu’à Chypre. Environ 7 000 personnes sont blessées et quelque 300 000 déplacées. Selon Human Rights Watch, plusieurs autorités libanaises ont fait preuve, au minimum, de négligence criminelle.
categories: [accident]
kind: event
start: "2020-08-04"
deaths:
  best: 218
  note:
    en: Confirmed deaths, the toll given by Wikipedia and Human Rights Watch. The dead included nationals of at least 14 countries, among them Lebanese, Syrians, Egyptians, Ethiopians, Bangladeshis and Filipinos; the sources give no death count by nationality.
    fr: Morts confirmés, bilan donné par Wikipédia et Human Rights Watch. Les victimes comptaient des ressortissants d’au moins 14 pays, dont des Libanais, des Syriens, des Égyptiens, des Éthiopiens, des Bangladais et des Philippins ; les sources ne donnent pas de bilan par nationalité.
