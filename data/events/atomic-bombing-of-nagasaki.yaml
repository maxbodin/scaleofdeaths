id: atomic-bombing-of-nagasaki
title:
  en: Atomic bombing of Nagasaki
  fr: Bombardement atomique de Nagasaki
description:
  en: >-
    On 9 August 1945, three days after Hiroshima, a United States B-29 bomber dropped "Fat Man", a plutonium bomb, on the Japanese port and industrial city of Nagasaki, where about 250,000 to 270,000 people were present. Hills confined the destruction largely to the Urakami Valley, home to the Mitsubishi arms factories, where thousands of workers died. Most victims died on the day itself and nearly all the others within months, from burns, injuries and acute radiation sickness. The dead included Koreans and Allied prisoners of war. Japan announced its surrender six days later.
  fr: >-
    Le 9 août 1945, trois jours après Hiroshima, un B-29 américain largue « Fat Man », bombe au plutonium, sur le port industriel de Nagasaki, où se trouvaient 250 000 à 270 000 personnes. Les collines limitent l’essentiel des destructions à la vallée d’Urakami et à ses usines d’armement Mitsubishi, où des milliers d’ouvriers périssent. La plupart des victimes meurent le jour même, presque toutes les autres dans les mois suivants, de brûlures, de blessures et d’irradiation aiguë, dont des Coréens et des prisonniers alliés. Le Japon annonce sa capitulation six jours plus tard.
categories: [war]
kind: event
partOf: second-world-war
start: "1945-08-09"
deaths:
  best: 70000
  low: 60000
  high: 80000
  note:
    en: Deaths by the end of 1945 from the blast, burns, injuries and acute radiation effects, including about 150 soldiers, 1,500 to 2,000 Koreans and 8 to 13 Allied prisoners of war; later cancer deaths among survivors are not included. Best is the 70,000 (plus or minus 10,000) estimated in the 1970s by Japanese-led reassessments and the 1977 international investigation team, as described by historian Alex Wellerstein. Low and high are the modern range of the Radiation Effects Research Foundation (60,000 to 80,000 deaths within two to four months), also used by Wikipedia. US estimates from the 1940s were lower (39,000 dead in the 1946 Manhattan Project report, 39,214 by mid-November 1945 for the Joint Commission), mainly because they assumed a smaller population in the city.
    fr: Morts jusqu’à la fin de 1945 dues au souffle, aux brûlures, aux blessures et aux effets aigus des radiations, dont environ 150 soldats, 1 500 à 2 000 Coréens et 8 à 13 prisonniers de guerre alliés ; les décès ultérieurs par cancer chez les survivants ne sont pas comptés. L’estimation centrale est celle de 70 000 morts (à 10 000 près) établie dans les années 1970 par des réévaluations menées par des Japonais et par l’équipe d’enquête internationale de 1977, telle que la présente l’historien Alex Wellerstein. La fourchette est l’estimation moderne de la Radiation Effects Research Foundation (60 000 à 80 000 morts dans les deux à quatre mois), reprise par Wikipédia. Les estimations américaines des années 1940 étaient plus basses (39 000 morts selon le rapport du projet Manhattan de 1946, 39 214 à la mi-novembre 1945 selon la Joint Commission), surtout parce qu’elles supposaient une population présente plus faible.
