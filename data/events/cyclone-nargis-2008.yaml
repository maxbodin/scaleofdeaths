  low: 84537
  note:
    en: >-
      84,537 confirmed dead and 53,836 missing, presumed dead, according to the Post-Nargis Joint Assessment by the Myanmar government, ASEAN and the United Nations (Wikipedia; OCHA reports over 84,530 dead and 53,836 missing). Best counts both; low counts confirmed deaths only.
    fr: >-
      84 537 morts confirmés et 53 836 disparus présumés morts selon l’évaluation conjointe post-Nargis du gouvernement du Myanmar, de l’ASEAN et des Nations unies (Wikipédia ; l’OCHA fait état de plus de 84 530 morts et de 53 836 disparus). L’estimation centrale compte les deux ; l’estimation basse ne compte que les morts confirmés.
