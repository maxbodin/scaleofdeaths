id: cyclone-nargis-2008
title:
  en: Cyclone Nargis
  fr: Cyclone Nargis
description:
  en: >-
    Cyclone Nargis made landfall in Myanmar on 2 May 2008 and crossed the densely populated Irrawaddy delta, where its storm surge pushed 40 km inland, before passing near Yangon. Whole villages were swept away, especially in Labutta and Bogale townships, and 2 to 3 million people were left homeless. The military government at first resisted large-scale international aid, delaying relief for the survivors. It was probably the worst disaster in Myanmar's history.
  fr: >-
    Le cyclone Nargis a touché terre au Myanmar le 2 mai 2008 et traversé le delta très peuplé de l’Irrawaddy, où son onde de tempête a pénétré à 40 km à l’intérieur des terres, avant de passer près de Rangoun. Des villages entiers ont été emportés, en particulier dans les cantons de Labutta et de Bogale, et 2 à 3 millions de personnes se sont retrouvées sans abri. La junte militaire a d’abord refusé une aide internationale de grande ampleur, retardant les secours. C’est sans doute la pire catastrophe de l’histoire du Myanmar.
categories: [natural-disaster]
