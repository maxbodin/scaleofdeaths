id: bangladesh-july-massacre-2024
title:
  en: July massacre (Bangladesh)
  fr: Massacre de juillet (Bangladesh)
description:
  en: >-
    Killings during the crackdown on the student-led protests in Bangladesh in July and August 2024. Protests against the reinstatement of quotas in public-sector jobs grew into a mass movement against Prime Minister Sheikh Hasina's government, which responded with live fire, curfews and internet shutdowns. Hasina resigned and fled the country on 5 August 2024. A UN fact-finding report found reasonable grounds to believe that the killings were carried out with the knowledge, coordination and direction of the former political leadership and senior security officials.
  fr: >-
    Tueries lors de la répression des manifestations étudiantes au Bangladesh en juillet et août 2024. Nées du rétablissement des quotas dans la fonction publique, les manifestations deviennent un mouvement de masse contre le gouvernement de Sheikh Hasina, qui répond par des tirs à balles réelles, des couvre-feux et des coupures d’internet. Hasina démissionne et fuit le pays le 5 août 2024. Selon un rapport d’enquête de l’ONU, il y a des motifs raisonnables de croire que les tueries ont été coordonnées et dirigées par l’ancienne direction politique et de hauts responsables de la sécurité.
categories: [genocide]
kind: event
start: "2024-07-01"
end: "2024-08-15"
deaths:
  best: 1400
  low: 1000
  high: 1581
  note:
    en: >-
      Best is the estimate of the UN human rights office (OHCHR) that as many as 1,400 people may have been killed between 1 July and 15 August 2024, most of them shot by security forces, 12 to 13% of them children; it includes 44 police officers reported killed by the Bangladesh Police (UN News). Low is the health ministry's count of more than 1,000 deaths reported in August 2024, and high the count of 1,581 deaths by the health sub-committee of the student movement Students Against Discrimination (both Wikipedia).
    fr: >-
      L’estimation centrale est celle du Haut-Commissariat des Nations unies aux droits de l’homme (HCDH), selon laquelle jusqu’à 1 400 personnes ont pu être tuées entre le 1er juillet et le 15 août 2024, pour la plupart abattues par les forces de sécurité, dont 12 à 13 % d’enfants ; elle inclut 44 policiers tués selon la police bangladaise (ONU Info). Le bas est le décompte du ministère de la Santé, plus de 1 000 morts, annoncé en août 2024, et le haut le décompte de 1 581 morts de la sous-commission santé du mouvement étudiant Students Against Discrimination (tous deux selon Wikipédia).
