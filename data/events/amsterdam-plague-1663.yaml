  note:
    en: Deaths in Amsterdam. Best is the 24,148 deaths given by Dutch Wikipedia, citing the Amsterdam City Archives; the City Archives' own page says "almost 25,000" deaths, more than ten percent of the population. No other estimate was found.
    fr: Morts à Amsterdam. L’estimation retenue est celle de 24 148 morts donnée par Wikipédia en néerlandais, d’après les Archives municipales d’Amsterdam ; la page de ces archives indique elle-même « près de 25 000 » morts, plus de dix pour cent de la population. Aucune autre estimation n’a été trouvée.
