deaths:
  best: 6000000
  low: 5700000
  high: 6200000
  note:
    en: Jewish victims only; Roma, Soviet prisoners of war, Polish civilians, people with disabilities and other groups persecuted by Nazi Germany are not included (Roma have their own entry). Best is the six million given by the United States Holocaust Memorial Museum (about 2.7 million murdered at killing centres, about 2 million in mass shootings, 800,000 to 1 million in ghettos and camps, at least 250,000 in other violence) and by Wikipedia. Low and high are the range of scholarly estimates given by Wikipedia (5.7 to 6.2 million; Timothy Snyder's conservative estimate is 5.7 million). Per-country figures are the low estimates of the Columbia Guide to the Holocaust (Niewyk and Nicosia, 2000) as tabulated in Wikipedia's World War II casualties article. They are by the victims' pre-war country (Poland and the Soviet Union in 1939 borders, Hungary and Romania in 1940 borders, Czech lands and Slovakia separately), not by place of death; most victims were killed in German-occupied Poland. The table covers 20 countries and its low estimates total 4,869,860, below the overall estimate.
    fr: Victimes juives uniquement ; les Roms, les prisonniers de guerre soviétiques, les civils polonais, les personnes handicapées et les autres groupes persécutés par l’Allemagne nazie ne sont pas comptés (les Roms ont leur propre fiche). L’estimation centrale est celle de six millions donnée par l’United States Holocaust Memorial Museum (environ 2,7 millions de personnes assassinées dans les centres de mise à mort, environ 2 millions lors de fusillades de masse, 800 000 à 1 million dans les ghettos et les camps, au moins 250 000 lors d’autres violences) et par Wikipédia. La fourchette est celle des estimations des historiens selon Wikipédia (5,7 à 6,2 millions ; l’estimation prudente de Timothy Snyder est de 5,7 millions). Les chiffres par pays sont les estimations basses du Columbia Guide to the Holocaust (Niewyk et Nicosia, 2000) reprises dans l’article de Wikipédia sur les pertes humaines de la Seconde Guerre mondiale. Ils sont donnés par pays d’avant-guerre des victimes (Pologne et Union soviétique dans leurs frontières de 1939, Hongrie et Roumanie dans celles de 1940, pays tchèques et Slovaquie séparément), et non par lieu de la mort ; la plupart des victimes ont été tuées en Pologne occupée. Le tableau couvre 20 pays et ses estimations basses totalisent 4 869 860 morts, moins que l’estimation globale.
