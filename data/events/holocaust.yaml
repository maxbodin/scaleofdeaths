id: holocaust
title:
  en: The Holocaust
  fr: Shoah
description:
  en: >-
    The genocide of European Jews by Nazi Germany and its allies and collaborators. After years of persecution, mass shootings by the Einsatzgruppen and other units began with the invasion of the Soviet Union in 1941. From 1942 Jews from across occupied Europe were deported to the killing centres of Chełmno, Belzec, Sobibor, Treblinka and Auschwitz-Birkenau, where most were gassed on arrival; others died of starvation, disease and abuse in ghettos and camps, or on death marches. About two thirds of Europe's Jews were murdered.
  fr: >-
    Génocide des Juifs d’Europe perpétré par l’Allemagne nazie, ses alliés et ses collaborateurs. Après des années de persécutions, les fusillades de masse des Einsatzgruppen commencent avec l’invasion de l’URSS en 1941. Dès 1942, les Juifs de l’Europe occupée sont déportés vers les centres de mise à mort de Chełmno, Belzec, Sobibor, Treblinka et Auschwitz-Birkenau, où la plupart sont gazés dès l’arrivée ; d’autres meurent de faim, de maladie et de sévices dans les ghettos et les camps, ou lors des marches de la mort. Environ deux tiers des Juifs d’Europe sont assassinés.
