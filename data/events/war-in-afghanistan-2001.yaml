start: "2001-10-07"
end: "2021-08-30"
deaths:
  best: 176206
  high: 212191
  note:
    en: >-
      Deaths caused directly by war violence in Afghanistan, October 2001 to August 2021. Best is the count of the Costs of War Project (Brown University, 2021): 69,095 Afghan military and police, 46,319 civilians, 52,893 opposition fighters, 2,324 US soldiers, 3,917 US contractors, 1,144 other allied troops, and journalists and aid workers. High is the Uppsala Conflict Data Program figure of more than 212,191 deaths (cited by Wikipedia). Indirect deaths from disease, hunger and loss of infrastructure are not included, nor are the 66,650 deaths of the related war in Pakistan.
    fr: >-
      Morts causées directement par la violence de la guerre en Afghanistan, d’octobre 2001 à août 2021. L’estimation centrale est le décompte du Costs of War Project (Université Brown, 2021) : 69 095 militaires et policiers afghans, 46 319 civils, 52 893 combattants de l’opposition, 2 324 soldats américains, 3 917 contractuels américains, 1 144 soldats alliés et des journalistes et humanitaires. Le haut est le chiffre de plus de 212 191 morts de l’Uppsala Conflict Data Program (cité par Wikipédia). Les morts indirectes dues aux maladies, à la faim et à la destruction des infrastructures ne sont pas comptées, pas plus que les 66 650 morts du conflit connexe au Pakistan.
