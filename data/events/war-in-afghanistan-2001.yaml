id: war-in-afghanistan-2001
title:
  en: War in Afghanistan (2001-2021)
  fr: Guerre d’Afghanistan (2001-2021)
description:
  en: >-
    War that began in October 2001 with the US-led invasion of Afghanistan after the September 11 attacks, which overthrew the Taliban government. US and NATO-led forces and the new Afghan government then fought a Taliban insurgency for two decades, with fighting, air strikes, roadside bombs and suicide attacks. After the 2020 Doha agreement and the withdrawal of foreign troops, the Taliban took Kabul in August 2021 and the last US forces left on 30 August.
  fr: >-
    Guerre commencée en octobre 2001 par l’invasion de l’Afghanistan menée par les États-Unis après les attentats du 11 septembre, qui renverse le gouvernement taliban. Les forces américaines et de l’OTAN et le nouveau gouvernement afghan combattent ensuite pendant deux décennies une insurrection talibane, faite de combats, de frappes aériennes, d’engins explosifs et d’attentats-suicides. Après l’accord de Doha de 2020 et le retrait des troupes étrangères, les talibans prennent Kaboul en août 2021 et les dernières forces américaines partent le 30 août.
categories: [war]
