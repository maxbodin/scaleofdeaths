id: spanish-flu
title:
  en: 1918 influenza pandemic ("Spanish flu")
  fr: Pandémie de grippe de 1918 (« grippe espagnole »)
description:
  en: >-
    An H1N1 influenza pandemic that spread worldwide in several waves at the end of the First World War, infecting about a third of the world's population. Unusually, it killed many healthy young adults.
  fr: >-
    Pandémie de grippe H1N1 qui s’est propagée dans le monde entier en plusieurs vagues à la fin de la Première Guerre mondiale, infectant environ un tiers de la population mondiale. Fait inhabituel, elle a tué de nombreux jeunes adultes en bonne santé.
categories: [epidemic]
kind: event
start: "1918-02"
end: "1920-04"
deaths:
  best: 50,000,000
  low: 17,000,000
  high: 100,000,000
  note:
    en: Estimates vary widely because many countries kept no reliable records.
    fr: Les estimations varient fortement, faute de registres fiables dans de nombreux pays.
