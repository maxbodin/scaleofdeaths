id: spanish-flu
title:
  en: Spanish flu (1918 influenza pandemic)
  fr: Grippe espagnole (pandémie de grippe de 1918)
description:
  en: >-
    Influenza pandemic caused by an H1N1 virus that spread worldwide in successive waves from 1918 to 1920, at the end of the First World War. About 500 million people, a third of the world's population, were infected. Unusually, it killed many healthy young adults, most often through secondary bacterial pneumonia, and mortality was highest in parts of Asia and Africa and on Pacific islands. Wartime censorship let neutral Spain report it freely, hence the misleading name.
  fr: >-
    Pandémie de grippe due à un virus H1N1, qui s’est propagée dans le monde entier par vagues successives de 1918 à 1920, à la fin de la Première Guerre mondiale. Environ 500 millions de personnes, un tiers de la population mondiale, ont été infectées. Fait inhabituel, elle a tué de nombreux jeunes adultes en bonne santé, le plus souvent par pneumonie bactérienne secondaire ; la mortalité a été la plus forte dans certaines régions d’Asie et d’Afrique et dans les îles du Pacifique. L’Espagne, neutre et sans censure de guerre, en parlait librement, d’où son nom trompeur.
categories: [epidemic]
kind: event
start: "1918-02"
end: "1920-04"
deaths:
  best: 50000000
  low: 17400000
  high: 100000000
  note:
    en: >-
      Deaths from the pandemic in all waves, 1918-1920. Best is the widely cited figure of about 50 million (Johnson and Mueller 2002; the CDC says at least 50 million). Low is the 17.4 million reassessment by Spreeuwenberg et al. (2018); high is Johnson and Mueller's upper bound of 100 million, as much of the world kept no records. Per-country figures are the published death tolls compiled by Johnson and Mueller (2002), using the low end where they give a range (Ghana 88,500-100,000, China 4-9.5 million); their Ireland figure covers the whole island and their Russia figure is a rough estimate. Exceptions: United Kingdom (around 250,000, The National Archives), New Zealand (around 9,000, Summers et al. 2018) and Iran (low end of Afkhami's 902,400-2,431,000). Countries with no reliable figure are left out, so the per-country total is well below the global estimate.
    fr: >-
      Morts de la pandémie sur toutes ses vagues, de 1918 à 1920. L’estimation centrale est le chiffre le plus cité, environ 50 millions (Johnson et Mueller 2002 ; au moins 50 millions selon les CDC). La fourchette basse est la réévaluation à 17,4 millions de Spreeuwenberg et al. (2018) ; la haute est la borne supérieure de 100 millions de Johnson et Mueller, une grande partie du monde n’ayant pas tenu de registres. Les chiffres par pays sont les bilans publiés compilés par Johnson et Mueller (2002), avec la borne basse quand ils donnent une fourchette (Ghana 88 500 à 100 000, Chine 4 à 9,5 millions) ; leur chiffre pour l’Irlande couvre toute l’île et celui de la Russie est une estimation grossière. Exceptions : Royaume-Uni (environ 250 000, The National Archives), Nouvelle-Zélande (environ 9 000, Summers et al. 2018) et Iran (borne basse de la fourchette d’Afkhami, 902 400 à 2 431 000). Les pays sans chiffre fiable sont omis : le total par pays reste donc bien inférieur à l’estimation mondiale.
