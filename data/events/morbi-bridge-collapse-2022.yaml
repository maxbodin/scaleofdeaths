id: morbi-bridge-collapse-2022
title:
  en: Morbi bridge collapse
  fr: Effondrement du pont de Morbi
description:
  en: >-
    On the evening of 30 October 2022, a 19th-century pedestrian suspension bridge over the Machchhu River in Morbi, Gujarat, India, collapsed while more than 500 people were on it during the Diwali and Gujarati New Year holidays, far above its official capacity of 125. The bridge had reopened five days earlier after renovation by a private clock-making group, without a safety audit or a certificate from the municipality. A forensic report found that the rusted cables could not bear the new heavy flooring. Many of the dead were women, elderly people and children.
  fr: >-
    Le soir du 30 octobre 2022, une passerelle suspendue du XIXe siècle sur la rivière Machchhu, à Morbi (Gujarat, Inde), s’effondre alors que plus de 500 personnes s’y trouvent pendant les fêtes de Diwali et du Nouvel An gujarati, bien plus que sa capacité officielle de 125. Le pont avait rouvert cinq jours plus tôt après sa rénovation par un groupe privé fabricant d’horloges, sans audit de sécurité ni accord de la municipalité. Une expertise conclut que les câbles rouillés ne pouvaient supporter le nouveau plancher, plus lourd. Beaucoup de victimes étaient des femmes, des aînés et des enfants.
categories: [accident]
kind: event
start: "2022-10-30"
deaths:
  best: 135
  high: 141
  note:
    en: Best is the final list of victims compiled by the Morbi district administration (The Indian Express, 5 November 2022), which counts 55 children among the 135 dead. High is the toll of 141 announced by Gujarat's junior Home Minister on 31 October during the rescue (The Hindu), which Wikipedia still gives as "at least 141".
    fr: L’estimation centrale est la liste définitive des victimes établie par l’administration du district de Morbi (The Indian Express, 5 novembre 2022), qui compte 55 enfants parmi les 135 morts. Le haut de fourchette est le bilan de 141 annoncé par le ministre adjoint de l’Intérieur du Gujarat le 31 octobre, pendant les secours (The Hindu), que Wikipédia reprend encore (« au moins 141 »).
