id: darfur-famine-1984
title:
  en: 1984-1985 famine in Sudan
  fr: Famine de 1984-1985 au Soudan
description:
  en: >-
    Famine in Sudan centred on the western regions of Darfur and Kordofan. The World Peace Foundation describes its immediate trigger as drought, against the backdrop of a highly extractive political economy and the neglect of Sudan's peripheries. The researcher Alex de Waal, who studied the famine in Darfur, argues that it planted the seeds of the war and atrocities that struck the region twenty years later.
  fr: >-
    Famine au Soudan centrée sur les régions occidentales du Darfour et du Kordofan. La World Peace Foundation en attribue le déclenchement à la sécheresse, sur fond d’économie politique très extractive et d’abandon des périphéries du pays. Le chercheur Alex de Waal, qui a étudié cette famine au Darfour, estime qu’elle a semé les germes de la guerre et des atrocités qui ont frappé la région vingt ans plus tard.
categories: [famine]
kind: event
start: "1984"
end: "1985"
deaths:
  best: 240000
  high: 250000
  note:
    en: "Excess deaths from hunger and disease. Best: 240,000, the World Peace Foundation estimate for Sudan in 1984-1985. High: 250,000, Ó Gráda's estimate. Both cover Sudan as a whole; Alex de Waal's Darfur-only estimate (Population Studies, 1989) could not be consulted."
    fr: "Surmortalité due à la faim et aux maladies. Valeur centrale : 240 000, estimation de la World Peace Foundation pour le Soudan en 1984-1985. Haut : 250 000, estimation d’Ó Gráda. Les deux chiffres couvrent tout le Soudan ; l’estimation d’Alex de Waal pour le seul Darfour (Population Studies, 1989) n’a pas pu être consultée."
