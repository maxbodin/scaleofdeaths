id: battle-of-stalingrad
title:
  en: Battle of Stalingrad
  fr: Bataille de Stalingrad
description:
  en: >-
    Battle for the industrial city of Stalingrad (now Volgograd) on the Volga, fought by Germany and its Romanian, Italian and Hungarian allies against the Soviet Union. A German air raid in August 1942 devastated the city, followed by months of close-quarters street fighting. In November the Soviet Operation Uranus encircled the German 6th Army, which surrendered on 2 February 1943 after a failed relief attempt; few of the 91,000 men taken prisoner survived Soviet captivity. It is considered the deadliest battle of the Second World War and a turning point of the war in Europe.
  fr: >-
    Bataille pour Stalingrad (aujourd’hui Volgograd), ville industrielle sur la Volga, opposant l’Allemagne et ses alliés roumains, italiens et hongrois à l’Union soviétique. Un raid aérien allemand dévaste la ville en août 1942, suivi de mois de combats de rue au corps à corps. En novembre, l’opération soviétique Uranus encercle la 6e armée allemande, qui capitule le 2 février 1943 après l’échec d’une tentative de dégagement ; peu des 91 000 hommes faits prisonniers survivent à la captivité. C’est la bataille la plus meurtrière de la Seconde Guerre mondiale et un tournant de la guerre en Europe.
