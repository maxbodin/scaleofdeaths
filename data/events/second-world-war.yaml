id: second-world-war
title:
  en: Second World War
  fr: Seconde Guerre mondiale
description:
  en: >-
    Global conflict between the Allies and the Axis powers, fought in Europe, Asia, Africa and the Pacific from 1939 to 1945, and from 1937 in China. It is the deadliest conflict in history. Most of the dead were civilians, killed in genocides, above all the Holocaust, in massacres and reprisals, sieges and strategic bombing, including the atomic bombings of Hiroshima and Nagasaki, or by war-related famine and disease in China, the Soviet Union, India, Indonesia and Indochina. The Soviet Union and China suffered the heaviest losses.
  fr: >-
    Conflit mondial opposant les Alliés aux puissances de l’Axe en Europe, en Asie, en Afrique et dans le Pacifique de 1939 à 1945, et dès 1937 en Chine. C’est le conflit le plus meurtrier de l’histoire. La plupart des morts sont des civils, victimes de génocides, au premier rang desquels la Shoah, de massacres et de représailles, de sièges et de bombardements stratégiques, dont les bombardements atomiques d’Hiroshima et de Nagasaki, ou des famines et épidémies liées à la guerre en Chine, en URSS, en Inde, en Indonésie et en Indochine. L’URSS et la Chine ont subi les plus lourdes pertes.
categories: [war]
kind: event
start: "1939-09-01"
end: "1945-09-02"
deaths:
  best: 75000000
  low: 60000000
  high: 85000000
  note:
    en: Military and civilian deaths from all causes, including genocide, bombing and war-related famine and disease; deaths in China are counted from 1937. Estimates differ mostly on how many famine and disease deaths are included. Low is the 60 million given by the Imperial War Museums, by the National WWII Museum (15 million battle deaths and 45 million civilian deaths), by the UN Secretary-General (40 million civilians and 20 million soldiers) and at the low end of Wikipedia's lead (60 to 75 million, citing Beevor, Hastings and Aubin et al.). High is the top of the total in Wikipedia's per-country table (70 to 85 million), which includes 19 to 28 million war-related famine and disease deaths that other compilations often leave out. No source gives a single central figure; best is 75 million, the top of the lead range and inside the table range. Per-country figures are the total deaths column of Wikipedia's World War II casualties table, using the low end of each range. They count each country's own dead, including soldiers who died abroad, in the borders used by the table, so Poland and the Baltic states (1939 borders) overlap the Soviet Union (1946-1991 borders), Germany includes Austria and ethnic Germans from eastern Europe, and a few small entries (Ireland, Luxembourg, Malta, Newfoundland) partly repeat deaths counted elsewhere. Colonies are listed under the present-day country covering the same territory (British India, which also covered Pakistan and Bangladesh, as India; the Dutch East Indies as Indonesia; Burma as Myanmar), or under their historical name when now split between several countries.
    fr: Morts militaires et civiles de toutes causes, y compris les génocides, les bombardements, les famines et les maladies liées à la guerre ; les morts en Chine sont comptées depuis 1937. Les estimations diffèrent surtout selon la part des morts de famine et de maladie retenue. Le bas de la fourchette correspond aux 60 millions avancés par les Imperial War Museums, par le National WWII Museum (15 millions de morts au combat et 45 millions de morts civiles), par le secrétaire général de l’ONU (40 millions de civils et 20 millions de soldats) et en bas de la fourchette de l’introduction de Wikipédia (60 à 75 millions, d’après Beevor, Hastings et Aubin et al.). Le haut de la fourchette est le haut du total du tableau par pays de Wikipédia (70 à 85 millions), qui inclut 19 à 28 millions de morts de famine et de maladie liées à la guerre, souvent omises ailleurs. Aucune source ne donne de chiffre central unique ; l’estimation centrale retenue, 75 millions, est le haut de la fourchette de l’introduction et se situe dans celle du tableau. Les chiffres par pays sont ceux de la colonne des morts totales du tableau de Wikipédia sur les pertes humaines de la Seconde Guerre mondiale, bas de chaque fourchette. Ils comptent les morts de chaque pays, y compris les soldats morts à l’étranger, dans les frontières retenues par le tableau ; la Pologne et les pays baltes (frontières de 1939) recoupent donc l’URSS (frontières de 1946-1991), l’Allemagne inclut l’Autriche et les Allemands ethniques d’Europe de l’Est, et quelques petites entrées (Irlande, Luxembourg, Malte, Terre-Neuve) reprennent en partie des morts comptées ailleurs. Les colonies figurent sous le pays actuel couvrant le même territoire (l’Inde britannique, qui comprenait aussi le Pakistan et le Bangladesh, sous l’Inde ; les Indes orientales néerlandaises sous l’Indonésie ; la Birmanie sous le Myanmar), ou sous leur nom historique lorsqu’elles sont aujourd’hui partagées entre plusieurs pays.
