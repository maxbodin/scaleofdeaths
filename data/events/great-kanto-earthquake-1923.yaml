id: great-kanto-earthquake-1923
title:
  en: 1923 Great Kantō earthquake
  fr: Grand tremblement de terre du Kantō de 1923
description:
  en: >-
    Just before noon on 1 September 1923 a magnitude 7.9 to 8.2 earthquake struck the Kantō plain, devastating Tokyo, Yokohama and the surrounding prefectures. Fires fanned by strong winds from a nearby typhoon raged for three days and caused about 90% of the deaths; a fire whirl at the Honjo Clothing Depot in Tokyo killed an estimated 40,000 people who had taken refuge there. In the chaos that followed, Koreans and political dissidents were murdered in the Kantō Massacre.
  fr: >-
    Peu avant midi, le 1er septembre 1923, un séisme de magnitude 7,9 à 8,2 a frappé la plaine du Kantō, dévastant Tokyo, Yokohama et les préfectures voisines. Les incendies, attisés par les vents violents d’un typhon proche, ont fait rage pendant trois jours et causé environ 90 % des morts ; un tourbillon de feu a tué quelque 40 000 personnes réfugiées sur le terrain du dépôt d’habillement de Honjo, à Tokyo. Dans le chaos qui a suivi, des Coréens et des opposants politiques ont été assassinés lors du massacre du Kantō.
categories: [natural-disaster]
kind: event
start: "1923-09-01"
deaths:
  best: 105385
  high: 142807
  note:
    en: Dead and missing. Best is the total established by modern research on the 1923 disaster reports and used by NOAA NCEI, with 91,781 deaths attributed to fire. The high is the older, frequently cited figure (about 142,800 for USGS), which added 43,476 missing to 99,331 dead; a 1926 Home Office report later cut the missing to 13,275. Killings of Koreans and others in the Kantō Massacre (from 248 confirmed by police to about 6,000 in some estimates) are a separate toll.
    fr: Morts et disparus. L’estimation centrale est le total établi par les recherches récentes sur les rapports de 1923 et retenu par la NCEI de la NOAA, dont 91 781 morts dues au feu. Le haut de la fourchette est l’ancien chiffre souvent cité (environ 142 800 pour l’USGS), qui ajoutait 43 476 disparus à 99 331 morts ; un rapport du ministère de l’Intérieur de 1926 a ramené les disparus à 13 275. Les meurtres de Coréens et d’autres personnes lors du massacre du Kantō (de 248 confirmés par la police à environ 6 000 selon certaines estimations) sont un bilan distinct.
