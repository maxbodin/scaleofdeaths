id: lebanon-war-2026
title:
  en: 2026 Lebanon war
  fr: Guerre du Liban de 2026
description:
  en: >-
    Renewed war between Israel and Hezbollah in Lebanon, part of the wider 2026 Iran war. Hostilities resumed on 2 March 2026, days after US and Israeli strikes on Iran killed Ali Khamenei, with Israeli air strikes across Lebanon and ground operations in the south, and Hezbollah rocket and drone fire on northern Israel. More than a million people were displaced in Lebanon. A temporary ceasefire took effect on 16 April 2026, but Israeli air strikes have continued.
  fr: >-
    Reprise de la guerre entre Israël et le Hezbollah au Liban, dans le cadre de la guerre d’Iran de 2026. Les hostilités reprennent le 2 mars 2026, quelques jours après les frappes américaines et israéliennes sur l’Iran qui tuent Ali Khamenei, avec des frappes aériennes israéliennes sur tout le Liban et des opérations terrestres dans le sud, et des tirs de roquettes et de drones du Hezbollah sur le nord d’Israël. Plus d’un million de personnes sont déplacées au Liban. Un cessez-le-feu temporaire entre en vigueur le 16 avril 2026, mais les frappes israéliennes continuent.
