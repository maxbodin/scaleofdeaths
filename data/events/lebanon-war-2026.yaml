deaths:
  best: 4389
  note:
    en: >-
      Best is the toll of Lebanon's health ministry: 4,389 people killed in Lebanon by Israeli attacks from 2 March to 12 October 2026, without distinguishing civilians from combatants (WAFA; LBCI reported 4,387 a day earlier). The ministry puts the toll since 8 October 2023 at 8,956, which includes the 2023-2024 war. Hezbollah fighters' deaths are estimated at over 1,000 by independent sources and 2,500 by Israel (Wikipedia). Not included: 41 Israeli soldiers and a contractor killed in northern Israel or southern Lebanon, civilians killed in Israel by Hezbollah fire, and about 190 Syrian civilians killed by Israel (Wikipedia).
    fr: >-
      L’estimation centrale est le bilan du ministère libanais de la Santé : 4 389 personnes tuées au Liban par des attaques israéliennes du 2 mars au 12 octobre 2026, sans distinction entre civils et combattants (WAFA ; LBCI donnait 4 387 la veille). Le ministère évalue à 8 956 le bilan depuis le 8 octobre 2023, qui inclut la guerre de 2023-2024. Les morts parmi les combattants du Hezbollah sont estimées à plus de 1 000 par des sources indépendantes et à 2 500 par Israël (Wikipédia). Ne sont pas comptés : 41 soldats israéliens et un sous-traitant tués dans le nord d’Israël ou le sud du Liban, les civils tués en Israël par des tirs du Hezbollah et environ 190 civils syriens tués par Israël (Wikipédia).
