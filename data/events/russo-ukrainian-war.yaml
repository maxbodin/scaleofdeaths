id: russo-ukrainian-war
title:
  en: Russo-Ukrainian war (since 2022)
  fr: Guerre russo-ukrainienne (depuis 2022)
description:
  en: >-
    Full-scale war that began on 24 February 2022 when Russia invaded Ukraine, escalating the conflict that started in 2014 with the annexation of Crimea and the war in Donbas. After Russian forces withdrew from around Kyiv and parts of the north-east and south, fighting settled into a long front line in the east and south, with heavy use of artillery, drones and missile strikes on cities and energy infrastructure, and cross-border attacks inside Russia.
  fr: >-
    Guerre de grande ampleur commencée le 24 février 2022 par l’invasion de l’Ukraine par la Russie, qui fait suite au conflit ouvert en 2014 par l’annexion de la Crimée et la guerre du Donbass. Après le retrait des forces russes des environs de Kiev et d’une partie du nord-est et du sud, les combats se fixent sur une longue ligne de front à l’est et au sud, avec un usage massif de l’artillerie, des drones et des frappes de missiles sur les villes et les infrastructures énergétiques, ainsi que des attaques en territoire russe.
categories: [war]
